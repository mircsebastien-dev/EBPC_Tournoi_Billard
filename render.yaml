# ATTENTION : le plan gratuit Render n'autorise PAS les disques persistants.
# Sans disque, tournoi.db (SQLite) est perdu à chaque redéploiement.
# -> Utiliser plûtôt Fly.io (fly.toml, volume 3 Go gratuit) ou Railway (voir README).
# Ce blueprint reste utile pour un test rapide sans persistance.
services:
  - type: web
    name: ebpc-tournoi-billard
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: ADMIN_PIN
        sync: false
