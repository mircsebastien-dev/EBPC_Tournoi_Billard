# fly.test.toml — app de TEST ebpc-tournoi-billard-test (détachée de la prod)
# Volume et base dédiés, jamais partagés avec la prod. Déployée automatiquement
# par le job deploy-test de .github/workflows/tests.yml à chaque push sur main.

app = 'ebpc-tournoi-billard-test'
primary_region = 'cdg'

[build]
[env]
  DB_PATH = '/data/tournoi.db'
  PORT = '3000'

[[mounts]]
  source = 'tournoi_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
