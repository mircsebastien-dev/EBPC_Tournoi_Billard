name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Batterie (API complète)
        run: |
          rm -f /tmp/t.db /tmp/t.db-wal /tmp/t.db-shm
          DB_PATH=/tmp/t.db PORT=4100 ADMIN_PIN=0000 node src/server.js > /tmp/server-batterie.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/api/health >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4100 ADMIN_PIN=0000 node test/batterie.js 2>&1 | tee batterie-out.txt
          exit ${PIPESTATUS[0]}

      - name: E2E (structure DKO, distances, SSE)
        if: always()
        run: |
          pkill -f 'src/server.js' || true
          rm -f /tmp/e.db /tmp/e.db-wal /tmp/e.db-shm
          DB_PATH=/tmp/e.db PORT=4101 ADMIN_PIN=0000 node src/server.js > /tmp/server-e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4101/api/health >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4101 ADMIN_PIN=0000 node test/e2e.js 2>&1 | tee e2e-out.txt
          exit ${PIPESTATUS[0]}

      - name: Full run (simulations complètes)
        if: always()
        run: |
          pkill -f 'src/server.js' || true
          rm -f /tmp/f.db /tmp/f.db-wal /tmp/f.db-shm
          DB_PATH=/tmp/f.db PORT=4102 ADMIN_PIN=0000 node src/server.js > /tmp/server-fullrun.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4102/api/health >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4102 ADMIN_PIN=0000 node test/fullrun.js 2>&1 | tee fullrun-out.txt
          exit ${PIPESTATUS[0]}

      - name: Simu invariants (anti-rematch, randomisé)
        if: always()
        run: |
          pkill -f 'src/server.js' || true
          rm -f /tmp/s.db /tmp/s.db-wal /tmp/s.db-shm
          DB_PATH=/tmp/s.db PORT=4103 ADMIN_PIN=0000 node src/server.js > /tmp/server-simu.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4103/api/health >/dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:4103 ADMIN_PIN=0000 NO_MANUEL=1 SEED=12345 node test/simu-invariants.js 2>&1 | tee simu-out.txt
          exit ${PIPESTATUS[0]}

      - name: Push unitaires (web-push mocké)
        if: always()
        run: node test/push-unit.js 2>&1 | tee push-unit-out.txt; exit ${PIPESTATUS[0]}

      - name: Purge unitaires (audit > 90 j)
        if: always()
        run: node test/purge-unit.js 2>&1 | tee purge-unit-out.txt; exit ${PIPESTATUS[0]}

      - name: Échecs en annotations
        if: failure()
        run: grep 'FAIL' batterie-out.txt 2>/dev/null | head -25 | while IFS= read -r l; do echo "::error::${l:0:250}"; done || true

      - name: Publier les résultats (branche ci-rapport)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          [ -f test/rapport.md ] && cp test/rapport.md out/rapport.md || true
          for f in batterie-out.txt e2e-out.txt fullrun-out.txt simu-out.txt push-unit-out.txt purge-unit-out.txt; do [ -f "$f" ] && cp "$f" out/ || true; done
          cp /tmp/server-*.log out/ 2>/dev/null || true
          echo "run: ${{ github.run_id }} — commit ${{ github.sha }} — ${{ github.event_name }}" > out/INFO.txt
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Résultats CI — run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-rapport

  deploy-test:
    name: App de test (auto après CI verte)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Déployer ebpc-tournoi-billard-test
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TEST_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::Secret FLY_TEST_TOKEN absent : déploiement de l'app de test sauté. Mise en place : docs/GUIDE_DEPLOY.md"
            exit 0
          fi
          if ! flyctl status -a ebpc-tournoi-billard-test >/dev/null 2>&1; then
            echo "::error::App ebpc-tournoi-billard-test inexistante. Commandes de création : docs/GUIDE_DEPLOY.md"
            exit 1
          fi
          flyctl deploy --config fly.test.toml
