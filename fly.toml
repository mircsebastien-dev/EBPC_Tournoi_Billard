# fly.toml app configuration file generated for ebpc-tournoi-billard on 2026-11-06T09:44:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ebpc-tournoi-billard'
primary_region = 'cdg'

[build]
[env]
  DB_PATH = '/data/tournoi.db'
  PORT = '3000'

[[mounts]]
  source = 'tournoi_data_restore'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
