app = "ebpc-tournoi-billard"
primary_region = "cdg"

[build]

[env]
  DB_PATH = "/data/tournoi.db"
  # ADMIN_PIN se définit via `fly secrets set ADMIN_PIN=xxxx`

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "tournoi_data"
  destination = "/data"
