<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique admin — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Table de marque</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');

function render() {
  main.innerHTML = '';
  if (!adminPin) { renderAdminLogin(main); return; }
  const hist = (adminState && adminState.historique) || [];
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, `🗂 Historique (${hist.length} tournois terminés)`),
    el('p', { class: 'muted' }, 'Consultation et suppression (admin).')));
  if (hist.length === 0) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', { class: 'muted' }, 'Aucun tournoi terminé.')));
    return;
  }
  for (const h of hist) {
    const carte = el('div', { class: 'panel match-admin', style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px' },
      el('div', {},
        el('div', { style: 'font-weight:800;font-size:18px' }, h.nom),
        el('div', { class: 'muted small' }, `${h.created_at.slice(0, 10)} · ${h.regle} · ${h.nb_joueurs} joueurs · ${h.nb_matchs} matchs · ${h.format === 'double' ? 'DKO ' + h.dko_tours : 'élim. directe'}${h.champion ? ` · 🏆 ${h.champion}` : ''}`)),
      el('div', { class: 'actions' },
        el('a', { href: `/tournoi.html?id=${h.id}` }, el('button', { class: 'secondary' }, 'Voir')),
        el('button', { class: 'danger', onclick: async () => {
          if (!confirmer(`Supprimer « ${h.nom} » de l'historique ?`)) return;
          try { await adminApi(`/api/admin/tournoi/${h.id}`, { method: 'DELETE' }); } catch (e) { alert(e.message); }
        } }, '🗑 Supprimer')));
    main.append(carte);
  }
}

async function init() {
  await adminInit(render);
  render();
}
init();
</script>
</body>
</html>
