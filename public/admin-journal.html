<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal d'audit — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Table de marque</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');
let filtreQ = '', filtreAction = '';

// Rollback avec diff préalable: montre ce qui va changer AVANT de demander le code PIN
async function confirmerRollback(a) {
  let diff = null;
  try { diff = await adminApi(`/api/admin/tournoi/rollback/diff?audit_id=${a.id}`); } catch (e) { diff = { error: e.message }; }
  const r = diff && diff.resume;
  const lignes = [`Événement #${a.id} (${a.action}) du ${a.created_at}`, ''];
  if (r) {
    lignes.push(`Matchs modifiés: ${r.matchs_modifies} · ajoutés: ${r.matchs_ajoutes} · supprimés: ${r.matchs_supprimes}`);
    lignes.push(`Joueurs: ${r.joueurs_avant} -> ${r.joueurs_apres} · statut: ${r.statut_avant} -> ${r.statut_apres}`);
    if (r.champion_avant !== r.champion_apres) lignes.push(`Champion: ${r.champion_avant} -> ${r.champion_apres}`);
    if (diff.modifies && diff.modifies.length) {
      lignes.push('', 'Exemples de matchs modifiés:');
      for (const m of diff.modifies.slice(0, 8)) lignes.push(` ${m.code}: ${m.avant.etat} ${m.avant.score1}-${m.avant.score2} -> ${m.apres.etat} ${m.apres.score1}-${m.apres.score2}`);
    }
  } else lignes.push('Diff indisponible: ' + (diff && diff.error));
  lignes.push('', 'Le contenu actuel du tournoi sera remplacé.');
  if (!confirm(`Restaurer le tournoi actif à l'état de cet événement ?\n\n` + lignes.join('\n'))) return;
  try {
    await adminApiDestructif('/api/admin/tournoi/rollback', { method: 'POST', body: JSON.stringify({ audit_id: a.id }) }, `restaurer le tournoi à l'événement #${a.id} (${a.action})`);
    alert('✅ Tournoi restauré');
    const y = window.scrollY; // re-render en place: conserve zoom et position de scroll (pas de location.reload)
    await render();
    window.scrollTo(0, y);
  } catch (e) { alert(e.message); }
}

// 31. Rapport d usage du tournoi (KPI) : panneau en tête du journal d audit.
// Mesure agrégée côté serveur, sans cookie ni tracker : adoption des joueurs inscrits,
// répartition des pages consultées, persistance après élimination, réactivité post-saisie,
// santé des API (échantillon 1 sur 10 + toutes les erreurs). Rapport : GET /api/admin/tournoi/usage.
function fmtPourcent31(v) { return typeof v === 'number' ? v + ' %' : 'sans donnée'; }
function fmtDuree31(s) {
  if (typeof s !== 'number') return 'sans donnée';
  if (s < 90) return s + ' s';
  if (s < 5400) return Math.round(s / 60) + ' min';
  return (Math.round(s / 360) / 10) + ' h';
}
function panelUsage31() {
  const box = el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, '📊 Rapport d usage du tournoi'),
    el('p', { class: 'muted small' }, 'Adoption, pages consultées, persistance après élimination, réactivité après saisie, santé des API. Mesure côté serveur, sans cookie ni tracker; relevés purgés après 90 jours.'),
    el('div', { id: 'usage-31' }, 'Chargement…'));
  (async () => {
    try {
      const { usage } = await adminApi('/api/admin/tournoi/usage');
      const c = document.getElementById('usage-31');
      if (!c) return;
      c.innerHTML = '';
      if (!usage) { c.append(el('p', { class: 'muted small' }, 'Aucun tournoi dans ce club.')); return; }
      c.append(
        el('p', { class: 'small' }, '🏆 Tournoi : ' + usage.tournoi.nom + ' (' + usage.tournoi.statut + ')' + (usage.fenetre ? ' · consultations du ' + usage.fenetre.du + ' au ' + usage.fenetre.au : '')),
        el('p', { class: 'small' }, '👀 ' + usage.pages.total + ' consultation(s) de page (' + usage.pages.identifiees + ' par un compte connecté, ' + usage.pages.anonymes + ' anonymes)' + (usage.par_page.length ? ' · top : ' + usage.par_page.slice(0, 6).map((p) => p.page + ' ×' + p.n).join(', ') : '')),
        el('p', { class: 'small' }, '👥 Adoption : ' + usage.adoption.ont_ouvert + ' joueur(s) sur les ' + usage.adoption.avec_compte + ' inscrits avec un compte ont ouvert l app (' + fmtPourcent31(usage.adoption.taux) + ') · ' + usage.adoption.inscrits + ' inscrits au total'),
        el('p', { class: 'small' }, '🔁 Persistance : ' + usage.persistance.revenus + ' joueur(s) éliminé(s) sur ' + usage.persistance.elimines_avec_compte + ' (avec compte) ont rouvert l app après leur élimination (' + fmtPourcent31(usage.persistance.taux) + ')'),
        el('p', { class: 'small' }, '⚡ Réactivité : ' + (usage.reactivite.delai_median_s != null ? fmtDuree31(usage.reactivite.delai_median_s) + ' en médiane entre la saisie d une manche et la prochaine consultation' : 'pas encore de mesure') + ' (' + usage.reactivite.manches + ' manche(s) saisie(s))'),
        el('p', { class: 'small' }, '🩺 Santé : ' + usage.sante.requetes + ' requête(s) API relevée(s), ' + fmtPourcent31(usage.sante.taux_erreurs) + ' d erreurs, latence médiane ' + (usage.sante.latence_mediane_ms != null ? usage.sante.latence_mediane_ms + ' ms' : 'sans donnée')));
    } catch (e) {
      const c = document.getElementById('usage-31');
      if (c) c.textContent = e.message;
    }
  })();
  return box;
}

async function render() {
  main.innerHTML = '';
  if (!adminPin && !adminCompte) { renderAdminLogin(main); return; }
  main.append(panelUsage31());
  main.append(el('div', { class: 'panel' },
  el('div', { class: 'row', style: 'justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px' },
    el('div', { class: 'hero-title' }, 'Journal d\'audit'),
    el('button', { class: 'danger', onclick: async () => {
      if (!confirm('Vider tout le journal d\'audit ? (irréversible)')) return;
      try {
        const r = await adminApiDestructif('/api/admin/audit', { method: 'DELETE' }, 'vider tout le journal d\'audit');
        alert('🗑 ' + t(r.supprimes + ' entrées supprimées'));
        await render();
      } catch (e) { alert(e.message); }
    } }, 'Vider le journal')),
  // filtres: texte libre + action exacte (Entrée pour valider)
  el('div', { class: 'row', style: 'margin:10px 0;gap:8px;flex-wrap:wrap' },
    (() => { const inp = el('input', { id: 'f-q', placeholder: 'Rechercher (action, cible, détails)…', value: filtreQ, style: 'flex:1 1 220px' });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { filtreQ = inp.value.trim(); render(); } });
      return inp; })(),
    (() => { const inp = el('input', { id: 'f-action', placeholder: 'Action exacte (ex: tirage)', value: filtreAction, style: 'flex:1 1 160px' });
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { filtreAction = inp.value.trim(); render(); } });
      return inp; })(),
    el('button', { class: 'secondary', onclick: () => { const q = document.getElementById('f-q'); const ac = document.getElementById('f-action'); filtreQ = (q ? q.value : '').trim(); filtreAction = (ac ? ac.value : '').trim(); render(); } }, 'Filtrer'),
    (filtreQ || filtreAction) ? el('button', { class: 'secondary', onclick: () => { filtreQ = ''; filtreAction = ''; render(); } }, '✖ Tout afficher') : null),
  el('div', { id: 'audit' }, 'Chargement…')));
  try {
    const qs = new URLSearchParams();
    if (filtreQ) qs.set('q', filtreQ);
    if (filtreAction) qs.set('action', filtreAction);
    const { audit } = await adminApi('/api/admin/audit' + (qs.toString() ? '?' + qs.toString() : ''));
    const box = document.getElementById('audit');
    box.innerHTML = '';
    box.append(el('p', { class: 'muted small' }, `${audit.length} entrée(s)` + (filtreQ || filtreAction ? ` — filtre ${[filtreQ && `texte="${filtreQ}"`, filtreAction && `action="${filtreAction}"`].filter(Boolean).join(' ')}` : '')),
    el('div', { class: 'table-wrap' }, el('table', { class: 'audit' },
      el('tr', {}, el('th', {}, ''), el('th', {}, 'Date'), el('th', {}, 'Action'), el('th', {}, 'Cible'), el('th', {}, 'Par'), el('th', {}, 'Détails')),
      ...audit.slice(0, 500).map(a => el('tr', {},
        el('td', {}, a.has_snapshot ? el('button', {
          class: 'secondary', style: 'padding:3px 8px;font-size:12px',
          onclick: () => confirmerRollback(a),
        }, '⏪ Restaurer à ce point') : null),
        el('td', {}, a.created_at), el('td', {}, a.action), el('td', {}, a.cible || ''),
        el('td', {}, a.auteur || ''), // pseudo du compte admin à l'origine de l'action (vide si code PIN ou automatique)
        el('td', { class: 'small muted' }, `${a.avant || ''} → ${a.apres || ''}`))))));
  } catch (e) {
    document.getElementById('audit').textContent = e.message;
  }
}

async function init() {
  await adminInit(render);
  render();
}
init();
</script>
</body>
</html>
