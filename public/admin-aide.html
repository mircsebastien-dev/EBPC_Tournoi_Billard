<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚙️ Guide admin — Tournoi EBPC</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top"><h1>⚙️ Guide admin</h1><div id="nav"></div></header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
document.getElementById("nav").append(nav("admin"));
const main = document.getElementById("main");
main.append(el("div", { class: "panel" },
  el("p", {}, "Accès : code PIN (env `ADMIN_PIN`) ou session d'un compte avec le rôle `admin` (bootstrap via `ADMIN_EMAIL`/`ADMIN_PASSWORD`, promotion depuis /admin-comptes.html)."),
  el("h2", {}, "1. Créer le tournoi"),
  el("p", {}, "/admin-tournoi.html → nom, règle, taille (16/32/64/128), format (élim. directe / double KO + nb tours), nb tables, date. Ajustement auto à la taille des payés. Tables réservées: vide par défaut. En phase inscription, la TV montre un grand QR centré pour s'inscrire. Switch 🔔 « Notif push « inscriptions ouvertes » (coché par défaut) : à la création, un push « 🎱 Nouveau tournoi — inscriptions ouvertes » est envoyé à tous les comptes abonnés."),
  el("h2", {}, "2. Inscriptions"),
  el("p", {}, "Ajouter / simuler / payer / supprimer. Seuls les payés sont tirés. ⛔ Pseudo d'un compte = réservé: inscription anonyme refusée (409, anti-usurpation); ajout admin possible après confirmation (joueur rattaché au compte). Un invité qui crée un compte avec le même pseudo est rattaché auto (reçoit les pushs). ♻️ Un compte connecté peut se désinscrire lui-même (bouton « Me désinscrire »), en phase d'inscription uniquement et avant paiement ; un joueur déjà payé ou sans compte passe par un admin. Pseudo/mdp oublié → /admin-comptes.html (✏️ pseudo, 🔑 mdp)."),
  el("h2", {}, "3. Tirage"),
  el("p", {}, "Bouton Tirage: appariements aléatoires crypto, byes répartis. ⚠️ Fige le bracket (retour en arrière possible uniquement par rollback point-in-time via le journal d'audit, voir §9)."),
  el("h2", {}, "4. Lancer les matchs"),
  el("p", {}, "Mode auto ON = départ auto sur table libre (ordre personnalisable). Manuel: clic sur une card (PIN) → modale. Tirage à la bande ⚪ sur la card, puis alternance à chaque manche. Joueurs: seul le ⚪ fait « casse ferme », l'autre « reprise ferme » (grisé + 403). Dernier point = confirmation obligatoire."),
  el("h2", {}, "5. Interventions en cours (clic card avec PIN → modale ⚙️)"),
  el("ul", {},
    el("li", {}, "👥 Changer les joueurs (WB/LB, blanc possible, bye auto) — 409 auto si la paire est déjà appariée ailleurs (hors finale): rematch impossible"),
    el("li", {}, "🎱 Déplacer de table (409 si occupée, « aucune » pour libérer)"),
    el("li", {}, "✏️ Corriger le score (si distance atteinte → termine + propage)"),
    el("li", {}, "🔓 Rouvrir un match — ⚠️ 409 INTERDIT si un match aval a déjà commencé"),
    el("li", {}, "🚫 Forfait (définitif)")),
  el("p", {}, "Règles DKO: WB/LB séparés jusqu'en finale; en F, alternance des moitiés + swap anti-rematch auto sur tous les tours WB/LB/F (rematch autorisé uniquement en vraie finale)."),
  el("h2", {}, "6. Données (/admin-data.html)"),
  el("p", {}, "Onglets Matchs / Joueurs / Events sur le tournoi actif OU un tournoi terminé (sélecteur), filtre par pseudo (Entrée). Events: 🗑 supprime un event et recalcule le score → les stats se corrigent. Joueurs: éditer pseudo/statut, supprimer."),
  el("h2", {}, "7. Classement par points"),
  el("p", {}, "Points = profondeur atteinte (WB: tour, F: k+tour en DKO), ex-aequo (1,1,1,4…). Les matchs clôturés sans gagnant ne comptent pas comme perdus."),
  el("h2", {}, "8. Clôturer"),
  el("p", {}, "« Terminer maintenant » = coupe net, aucun champion auto (sauf choix explicite dans le select). Fin normale = champion auto via la finale. Historique ensuite en liste + recherche/surbrillance joueur."),
  el("h2", {}, "9. Annuler une action : rollback point-in-time (journal d'audit)"),
  el("p", {}, "/admin-journal.html : chaque action admin est loguée ET snapshotée. Bouton ⏮ « Restaurer à ce point » sur une entrée = restaure le tournoi actif à l'état exact de cet événement (transaction atomique ; fonctionne même avec des matchs en cours → remis à 0-0, tables libérées). Un diff (matchs modifiés/ajoutés/supprimés, joueurs, statut, champion) s'affiche dans la confirmation avant validation. 409 si le snapshot concerne un autre tournoi, 404 sans snapshot. Le rollback est lui-même logué. Filtres du journal : recherche texte + type d'action."),
  el("h2", {}, "10. Comptes & audit"),
  el("p", {}, "/admin-comptes.html: liste (dernière connexion, inscri., matchs, sessions, amis : amis avec compte + pseudos suivis sans compte), ✏️ pseudo, 🔑 mdp, 🗑 supprimer (historique matchs conservé). Purge auto des comptes inactifs > 18 mois. /admin-journal.html: 500 dernières actions admin, lancements lisibles (« wb1-001 — P11 vs P07 (table 3) »). Le rollback point-in-time (bouton ⏮ « Restaurer à ce point ») est détaillé §9. 🔐 Toute action destructive (suppression tournoi/compte/event, vidage du journal, rollback) exige le code PIN re-saisi (modale masquée, `confirm_pin`) — sauf la désinscription d'un joueur. Une session de compte avec le rôle `admin` ne redemande pas le PIN, mais exige de saisir le mot `SUPPRIMER` dans la modale de confirmation."),
  el("h2", {}, "11. Tests & déploiement"),
  el("p", {}, "Batterie: BASE=http://127.0.0.1:PORT node test/batterie.js (203 checks → test/rapport.md) + test/e2e.js + test/fullrun.js ; sans serveur : node test/push-unit.js (push mocké), node test/purge-unit.js (purge > 90 j). Fly: secrets ADMIN_PIN, RESEND_API_KEY, MAIL_FROM, VAPID_* (jamais BASE_URL); volume tournoi_data sur /data; snapshots dans Volumes."),
  el("p", { class: "muted small", style: "margin-top:16px" }, "Version complète: docs/GUIDE_ADMIN.md dans le dépôt GitHub.")));
</script>
</body>
</html>
