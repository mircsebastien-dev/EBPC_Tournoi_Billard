<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joueur — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const main = document.getElementById('main');
document.getElementById('nav').append(nav('joueur'));
let state = null;
let joueurId = Number(localStorage.getItem('ebpc_joueur_id') || 0);

function renderSelecteur() {
  main.innerHTML = '';
  // si un compte est connecté et rattaché à un joueur du tournoi -> auto-sélection
  if (state && state.compte && state.actif) {
    const j = state.actif.joueurs.find(x => x.compte_id === state.compte.id);
    if (j && j.id !== joueurId) { joueurId = j.id; localStorage.setItem('ebpc_joueur_id', String(j.id)); renderMatchs(); return; }
  }
  if (!state || !state.actif) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', { class: 'muted' }, 'Aucun tournoi en cours.')));
    return;
  }
  const t = state.actif;
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, 'Qui es-tu ?'),
    el('p', { class: 'muted', style: 'margin-bottom:14px' }, 'Touche ton pseudo ci-dessous.'),
    // invité (pas de compte) -> on ne peut choisir que des joueurs sans compte (pas de joueur enregistré)
    const connecte = !!(state && state.compte);
    if (!connecte && joueurId) {
      const jCourant = t.joueurs.find(x => x.id === joueurId);
      if (jCourant && jCourant.compte_id) { joueurId = 0; localStorage.removeItem('ebpc_joueur_id'); }
    }
    const visibles = t.joueurs.filter(j => connecte || !j.compte_id);
    el('div', { class: 'liste-joueurs' },
      visibles.map(j => el('button', {
        class: 'joueur-btn secondary',
        onclick: () => { joueurId = j.id; localStorage.setItem('ebpc_joueur_id', String(j.id)); renderMatchs(); }
      }, j.pseudo)))));
}

function renderMatchs() {
  main.innerHTML = '';
  const t = state.actif;
  const moi = t.joueurs.find(j => j.id === joueurId);
  if (!moi) { renderSelecteur(); return; }
  const compteId = (state.compte && state.compte.id) || 0;
  const mesMatchs = t.matchs.filter(m => (m.joueur1 && (m.joueur1.id === joueurId || (compteId && m.joueur1.compte_id === compteId))) || (m.joueur2 && (m.joueur2.id === joueurId || (compteId && m.joueur2.compte_id === compteId))));

  main.append(el('div', { class: 'panel', style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px' },
    el('div', { class: 'hero-title' }, `👋 ${moi.pseudo}`),
    el('button', { class: 'secondary', onclick: () => { joueurId = 0; localStorage.removeItem('ebpc_joueur_id'); renderSelecteur(); } }, 'Changer')));

  if (mesMatchs.length === 0) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', { class: 'muted' }, 'Aucun match pour le moment. Le tirage arrive bientôt ! 🎱')));
    return;
  }
  const aJouer = mesMatchs.filter(m => m.etat === 'en_cours' || m.etat === 'pret');
  const autres = mesMatchs.filter(m => !aJouer.includes(m));
  if (aJouer.length > 0) {
    main.append(el('div', { class: 'panel' },
      el('h2', {}, '🔴 À toi de jouer'),
      el('div', { class: 'matchs-grid' }, aJouer.map(m => matchCard(m, { onClick: () => location.href = `/match.html?id=${m.id}&joueur=${joueurId}` })))));
  }
  if (autres.length > 0) {
    main.append(el('div', { class: 'panel' },
      el('h2', {}, 'Tes matchs'),
      el('div', { class: 'matchs-grid' }, autres.map(m => matchCard(m)))));
  }
}

function render() { if (joueurId && state && state.actif) renderMatchs(); else renderSelecteur(); }

async function init() {
  state = await api('/api/etat');
  render();
  connecterSSE((s) => { state = s; render(); });
}
init();
</script>
</body>
</html>
