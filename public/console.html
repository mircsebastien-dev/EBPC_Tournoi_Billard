<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🛡️ Console super-admin — Plateforme</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🛡️ Console super-admin</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');

// 17i: la console plateforme n appartient à AUCUN club (même ebpc). Tout passe par /api/super/*
// (clubs, tous les comptes, base complète, rôles plateforme), qui ignore le contexte club stocké.
// Pour agir DANS un club (support/debug): le sélecteur du bas ouvre son admin avec X-Club explicite.
// 17i v3: la console devient un hub d accès rapides ; chaque action vit dans sa page dédiée
// (super-clubs.html, super-base.html, super-comptes.html), comme la table de marque avant elle.

async function charger() {
  main.innerHTML = '';
  if (!adminPin && !adminCompte) { renderAdminLogin(main); return; }
  try {
    const scan = await adminApi('/api/super/scan');
    if (!scan || scan.super_admin !== true) throw Object.assign(new Error('zone refusée'), { status: 403 });
  } catch (e) {
    main.append(el('div', { class: 'panel' }, el('p', { class: 'muted' }, '⛔ ' + (e.status === 403
      ? 'Console réservée au super-admin de la plateforme : code global ou compte super-admin. Un code de club ou une session de club n y a jamais accès.'
      : e.message))));
    return;
  }
  try {
    const { clubs } = await adminApi('/api/super/clubs');
    render(clubs);
    chargerComptes();
    if (typeof LANG !== 'undefined' && LANG !== 'fr') traduireDomStatique(main);
  } catch (e) {
    main.append(el('div', { class: 'panel' }, el('p', { class: 'muted' }, '⛔ ' + e.message)));
  }
}

// 17h/17i: vue « tous les comptes de la plateforme » ; 17i v2: la liste détaillée et les réglages
// (rôle plateforme, rôles club) ont déménagé dans la page dédiée /super-comptes.html, la console
// n affiche plus qu un accès rapide avec le décompte des comptes par club d attachement
async function chargerComptes() {
  const p = document.getElementById('comptes-tous');
  if (!p) return;
  try {
    const rep = await adminApi('/api/super/comptes');
    const rows = (rep && rep.comptes) || [];
    p.innerHTML = '';
    const parClub = {}; // décompte des comptes par club d attachement (club d origine)
    for (const c of rows) { const s = c.club_slug || '-'; parClub[s] = (parClub[s] || 0) + 1; }
    p.append(el('h2', {}, '👥 Comptes de la plateforme'),
      el('p', { class: 'muted small' },
        rows.length + ' compte(s), tous clubs confondus. Le rôle plateforme (🛡️ super_admin = accès console, 👑 admin = ancien rôle plateforme) et les rôles club se règlent désormais sur la page dédiée : liste filtrable par club d attachement, rôle plateforme ou recherche, fiche complète par compte.'),
      ...(Object.keys(parClub).length ? [el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px;align-items:center' },
        ...Object.keys(parClub).sort().map(s => el('span', { class: 'muted small' }, s + ' × ' + parClub[s])))] : []),
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { onclick: () => { location.href = '/super-comptes.html'; } }, '👤 Ouvrir la page dédiée')));
    if (typeof LANG !== 'undefined' && LANG !== 'fr') traduireDomStatique(p);
  } catch (e) { p.append(el('p', { class: 'muted' }, e.message)); }
}

function panelContexteClub(clubs) {
  // 17i: accès support/debug à l admin d un club précis (contexte explicite, X-Club)
  const sel = el('select', { style: 'max-width:280px' }, ...clubs.map(c => el('option', { value: c.slug }, `${c.nom} (${c.slug})`)));
  return el('div', { class: 'panel', style: 'margin-top:12px' },
    el('h2', {}, '🚪 Accès aux pages d un club (support)'),
    el('p', { class: 'muted small' }, 'La console est hors des clubs ; pour intervenir dans un club précis, ouvre son admin dans le contexte explicite de ce club.'),
    el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px;align-items:center' }, sel,
      el('button', { onclick: () => {
        if (!sel.value) return;
        try { localStorage.setItem(CLUB_KEY, sel.value); } catch (e) {}
        location.href = '/admin.html?club=' + encodeURIComponent(sel.value); // 17s: club explicite dans l URL
      } }, '🚪 Ouvrir l admin de ce club'),
      el('button', { class: 'secondary', onclick: () => {
        try { localStorage.removeItem(CLUB_KEY); } catch (e) {}
        location.href = '/admin.html';
      } }, '↩️ Admin du club par défaut')));
}

// 17i v3: hub de la console : liens vers les pages dédiées, accès rapide comptes, sélecteur support.
function render(clubs) {
  main.append(el('div', { class: 'panel' },
    el('h2', {}, '🧭 Pages dédiées de la console'),
    el('p', { class: 'muted small' }, 'Comme la table de marque pour la diffusion, chaque action de la console vit désormais dans sa page dédiée :'),
    el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px' },
      el('a', { href: '/super-clubs.html' }, el('button', { class: 'secondary' }, '🏛️ Clubs de la plateforme')),
      el('a', { href: '/super-base.html' }, el('button', { class: 'secondary' }, '💾 Base complète de la plateforme')),
      el('a', { href: '/super-comptes.html' }, el('button', { class: 'secondary' }, '👥 Comptes de la plateforme')))));
  main.append(el('div', { id: 'comptes-tous', class: 'panel', style: 'margin-top:12px' }, el('p', { class: 'muted' }, 'Chargement…')));
  main.append(panelContexteClub(clubs));
}

async function init() {
  const ok = await adminInit(() => {});
  if (!ok) { renderAdminLogin(main); return; }
  await charger();
}
init();
</script>
</body>
</html>
