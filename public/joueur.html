<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche joueur — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
document.getElementById('nav').append(nav('home'));
const main = document.getElementById('main');
const id = Number(new URLSearchParams(location.search).get('id'));

async function init() {
  main.innerHTML = '';
  if (!id) { main.append(el('div', { class: 'panel', style: 'text-align:center' }, 'Joueur introuvable.')); return; }
  try {
    const s = await api(`/api/joueur/${id}/stats`);
    const j = s.joueur;
    main.append(el('div', { class: 'panel', style: 'text-align:center' },
      el('div', { class: 'hero-title' }, `👤 ${j.pseudo}`),
      el('div', { class: 'row', style: 'justify-content:center;gap:10px;flex-wrap:wrap' },
        el('span', { class: 'chip' }, `🏆 ${s.gagnes} gagnés`),
        el('span', { class: 'chip' }, `🎱 ${s.joues} joués`),
        el('span', { class: 'chip' }, `❌ ${s.perdus} perdus`),
        s.enCours ? el('span', { class: 'chip' }, `🔴 ${s.enCours} en cours`) : null,
        el('span', { class: 'chip' }, `📊 ${s.winrate}% victoires`))));
    main.append(el('div', { class: 'panel' },
      el('h2', {}, '📈 Statistiques'),
      el('div', { class: 'row', style: 'flex-wrap:wrap;gap:10px' },
        el('span', { class: 'chip' }, `Manches gagnées : ${s.manches}`),
        el('span', { class: 'chip' }, `💥 Run-outs : ${s.runouts}`),
        el('span', { class: 'chip' }, `💥 Casse ferme : ${s.casse}`),
        el('span', { class: 'chip' }, `🔄 Reprise ferme : ${s.reprise}`))));
    // historique des matchs joués (date, tournoi, adversaire, score, V/D)
    const h = await api(`/api/joueur/${id}/historique`);
    if (h.historique && h.historique.length) {
      main.append(el('div', { class: 'panel' },
        el('h2', {}, `🧾 Historique (${h.historique.length} matchs)`),
        el('table', { class: 'audit' },
          el('tr', {}, el('th', {}, 'Date'), el('th', {}, 'Tournoi'), el('th', {}, 'Match'), el('th', {}, 'Adversaire'), el('th', {}, 'Score'), el('th', {}, 'Résultat')),
          ...h.historique.map(x => el('tr', {},
            el('td', {}, fmtDateHeureSql(x.date || '')),
            el('td', {}, x.tournoi + (x.tournoi_statut === 'en_cours' ? ' 🔴' : '')),
            el('td', { class: 'code-match' }, x.code),
            el('td', {}, x.adversaire_id ? el('a', { href: `/joueur.html?id=${x.adversaire_id}`, style: 'color:var(--pink-soft)' }, x.adversaire || '—') : '—'),
            el('td', { style: 'font-weight:800' }, `${x.moi} – ${x.lui}`),
            el('td', {}, x.victoire
              ? el('span', { style: 'color:var(--green);font-weight:800' }, `✅ V (${x.gagnant})`)
              : el('span', { style: 'color:var(--muted)' }, `❌ D${x.forfait ? ' (forfait)' : ''}`)))))));
    }
  } catch (e) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, e.message));
  }
}
init();
</script>
</body>
</html>
