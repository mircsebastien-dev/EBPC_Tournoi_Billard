<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement saison — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
// 26a. Classement saison du club : points cumulés des tournois terminés (profondeur atteinte),
// page publique scopée au club courant (X-Club posé par api()), filtre par année de saison.
const main = document.getElementById('main');
document.getElementById('nav').append(nav('classement'));
let annee26 = null; // null = toutes les années

async function init() {
  main.innerHTML = '';
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, 'Classement saison'),
    el('p', { class: 'muted' }, 'Points cumulés des tournois terminés du club : la profondeur atteinte dans chaque tournoi compte. Joue et rejoue pour grimper au classement.')));
  let d = null;
  try { d = await api('/api/classement-saison' + (annee26 ? '?annee=' + encodeURIComponent(annee26) : '')); }
  catch (e) { main.append(el('div', { class: 'panel' }, el('p', { class: 'muted' }, e.message))); return; }
  // sélecteur de saison : toutes les années + une entrée par saison ayant au moins un tournoi terminé
  const sel = el('select', { id: 'an26', style: 'max-width:220px' },
    el('option', { value: '' }, 'Toutes les années'),
    ...(d.annees || []).map((a) => el('option', { value: String(a), ...(annee26 === String(a) ? { selected: true } : {}) }, 'Saison ' + a)));
  sel.addEventListener('change', () => { annee26 = sel.value || null; init(); });
  main.append(el('div', { class: 'panel', style: 'padding:12px 14px' }, sel));
  if (!d.classement || d.classement.length === 0) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', { class: 'muted' }, 'Aucun tournoi terminé pour le moment.')));
    return;
  }
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'table-wrap' }, el('table', { class: 'audit' },
      el('tr', {}, el('th', {}, '#'), el('th', {}, 'Joueur'), el('th', {}, '⭐ Points saison'), el('th', {}, 'Tournois'), el('th', {}, '🏆 Titres'), el('th', {}, 'Dernier tournoi')),
      ...d.classement.map((p) => el('tr', {},
        el('td', { style: 'font-weight:800' }, p.rang === 1 ? '🥇 1' : p.rang === 2 ? '🥈 2' : p.rang === 3 ? '🥉 3' : String(p.rang)),
        el('td', { style: 'font-weight:700' }, p.id ? el('a', { href: '/joueur.html?id=' + p.id, style: 'color:var(--pink-soft)' }, p.pseudo) : p.pseudo),
        el('td', { style: 'font-weight:800;color:var(--gold)' }, String(p.points)),
        el('td', {}, String(p.tournois)),
        el('td', {}, p.titres > 0 ? '🏆 ' + p.titres : '—'),
        el('td', { class: 'small muted' }, p.dernier || '')))))));
}
init();
</script>
</body>
</html>
