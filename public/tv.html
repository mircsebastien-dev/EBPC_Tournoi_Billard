<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<style>
body.tv { background: #050508; overflow: hidden; }
body.tv main { max-width: none; padding: 0; height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; }
.slide { display: none; width: 100%; text-align: center; padding: 20px; animation: fadein 0.5s; }
.slide.on { display: block; }
@keyframes fadein { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
.tv-big { font-size: clamp(28px, 6vw, 56px); font-weight: 800; margin: 10px 0; }
.tv-vs { display: flex; justify-content: center; align-items: center; gap: 5vw; margin: 20px 0; }
.tv-vs .p { font-size: clamp(26px, 5.5vw, 64px); font-weight: 800; }
.tv-vs .s { font-size: clamp(60px, 12vw, 150px); font-weight: 800; color: var(--pink); font-variant-numeric: tabular-nums; }
.tv-table { display: inline-block; margin-top: 14px; font-size: clamp(18px, 3.5vw, 30px); font-weight: 800; color: var(--gold); background: rgba(255,209,102,.1); border: 1px solid rgba(255,209,102,.5); border-radius: 14px; padding: 8px 22px; }
.tv-live-badge { display: inline-block; background: var(--pink); color: #fff; font-weight: 800; font-size: clamp(14px, 2.5vw, 24px); border-radius: 999px; padding: 6px 22px; animation: blink 1s infinite; }
.tv-next-title { font-size: clamp(20px, 4vw, 36px); color: var(--pink-soft); font-weight: 800; margin-bottom: 16px; }
.tv-next-list-wrap { max-height: 55vh; overflow: hidden; position: relative; }
.tv-next-list { display: inline-flex; flex-direction: column; gap: 10px; text-align: left; transition: transform 0.8s ease; }
.tv-next-list.scrolling { animation: tvscroll 12s linear infinite; }
@keyframes tvscroll { 0% { transform: translateY(0); } 80% { transform: translateY(calc(-100% + 45vh)); } 100% { transform: translateY(calc(-100% + 45vh)); } }
#rotate-overlay { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(5,5,8,0.96); color: var(--text); flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 20px; }
#rotate-overlay .big { font-size: clamp(40px, 10vw, 90px); }
#rotate-overlay .small { color: var(--muted); font-size: clamp(16px, 3vw, 26px); }
/* TV (grand écran) : overlay plein écran en portrait. Smartphone : juste un bandeau discret non bloquant */
@media (orientation: portrait) and (min-width: 900px) { #rotate-overlay { display: flex; } }
@media (orientation: portrait) and (max-width: 899px) {
  #rotate-overlay { display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: auto; inset: auto; z-index: 99; flex-direction: row; gap: 10px; padding: 8px 12px; background: rgba(255,46,136,.92); font-size: 13px; font-weight: 700; justify-content: center; }
  #rotate-overlay .big { font-size: 18px; }
  #rotate-overlay .big[style] { font-size: 13px !important; }
  #rotate-overlay .small { font-size: 12px; }
}
.tv-next-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 20px; font-size: clamp(16px, 3vw, 28px); font-weight: 600; display: flex; justify-content: space-between; gap: 30px; }
.tv-next-item .meta { color: var(--muted); font-size: 0.75em; font-weight: 600; }
.tv-dots { position: fixed; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
.tv-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.tv-dots span.on { background: var(--pink); box-shadow: 0 0 10px var(--pink-glow); }
#celebration { display: none; position: fixed; inset: 0; z-index: 200; background: #050508; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; animation: popin .4s; overflow: hidden; }
#celebration::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(255,46,136,.18), transparent 60%); pointer-events: none; }
#celebration.on { display: flex; }
@keyframes popin { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#celebration > div { position: relative; z-index: 1; }
#celebration .felicitations { font-size: clamp(26px, 5vw, 52px); font-weight: 800; color: var(--pink-soft); }
#celebration .winner { font-size: clamp(44px, 10vw, 110px); font-weight: 900; background: linear-gradient(90deg, var(--gold), #fff, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#celebration .score-line { font-size: clamp(20px, 4vw, 40px); color: var(--text); font-weight: 700; }
.sparkle { position: absolute; font-size: 22px; animation: fall linear forwards; pointer-events: none; }
@keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
.tv-champion { font-size: clamp(40px, 9vw, 110px); font-weight: 800; background: linear-gradient(90deg, var(--gold), #fff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tv-qr-big { display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:18px; text-align:center; }
.tv-qr-big img { width:min(640px,68vh,92vw); height:auto; background:#fff; padding:10px; border-radius:14px; }
</style>
</head>
<body class="tv">
<header class="top">
  <h1>🎱 <span id="titre">Pink City Billard</span></h1>
  <span id="statut" class="badge">—</span>
  <div id="nav"></div>
</header>
<main id="slides"></main>
<div class="tv-dots" id="dots"></div>
<div class="tv-qr" title="Scanner pour ouvrir le site sur ton téléphone">
  <img id="qr" alt="QR code du site" width="110" height="110">
  <div class="tv-qr-label">📱 Scannez moi<br><span id="qr-url"></span></div>
</div>
<script>
  // URL recalculée selon l'hébergement (Render, Fly, local...)
  const siteUrl = location.origin;
  document.getElementById('qr').src = '/api/qrcode.svg?text=' + encodeURIComponent(siteUrl);
  document.getElementById('qr-url').textContent = siteUrl.replace(/^https?:\/\//, '');
</script>
<div id="celebration"><div class="felicitations">🎉 Félicitations ! 🎉</div><div class="winner" id="cel-winner"></div><div class="score-line" id="cel-score"></div></div>
<div id="rotate-overlay"><div class="big">🔄</div><div class="big" style="font-size:clamp(24px,5vw,44px);font-weight:800">Tourne l'écran en paysage</div><div class="small">La TV Pink City est pensée pour le mode paysage</div></div>
<script src="/common.js"></script>
<script>
document.getElementById('nav').append(nav('tv'));
const slidesEl = document.getElementById('slides');
const dotsEl = document.getElementById('dots');
let state = null;
let slideIdx = 0;
let timer = null;
const SLIDE_MS = 6000;

function slidesList() {
  const t = state && state.actif;
  if (!t) return [{ type: 'vide' }];
  if (t.champion) return [{ type: 'champion', t }];
  // TV = uniquement les matchs EN COURS (plus de slide « prochains matchs »)
  const enCours = t.matchs.filter(m => m.etat === 'en_cours');
  const slides = [];
  const LIVE_PAR_PAGE = 8;
  for (let i = 0; i < enCours.length; i += LIVE_PAR_PAGE) {
    slides.push({ type: 'live-group', items: enCours.slice(i, i + LIVE_PAR_PAGE), page: Math.floor(i / LIVE_PAR_PAGE) + 1, total: Math.ceil(enCours.length / LIVE_PAR_PAGE) });
  }
  if (slides.length === 0) slides.push({ type: 'attente', t });
  return slides;
}

function render() {
  const slides = slidesList();
  if (slideIdx >= slides.length) slideIdx = 0;
  slidesEl.innerHTML = '';
  dotsEl.innerHTML = '';
  const t = state && state.actif;
  document.getElementById('titre').textContent = t ? t.tournoi.nom : 'Pink City Billard';
  const st = document.getElementById('statut');
  st.textContent = !t ? 'En attente' : t.tournoi.statut === 'en_cours' ? '🔴 EN DIRECT' : t.tournoi.statut === 'termine' ? '🏁 TERMINÉ' : 'Inscriptions';
  st.className = `badge ${t ? t.tournoi.statut : ''}`;

  slides.forEach((s, i) => {
    const div = el('div', { class: 'slide' + (i === slideIdx ? ' on' : '') });
    if (s.type === 'live-group') {
      const grid = el('div', { class: 'tv-live-grid' });
      for (const m of s.items) {
        const r = t.rounds.find(rr => rr.bracket === m.bracket && rr.tour === m.tour);
        grid.append(el('div', { class: 'tv-live-cell' + (m.etat === 'en_cours' ? ' on' : '') },
          el('div', { class: 'cell-code' }, codeMatch(m)),
          el('div', { class: 'cell-vs' }, `${m.joueur1 ? m.joueur1.pseudo : '…'} – ${m.joueur2 ? m.joueur2.pseudo : '…'}`),
          el('div', { class: 'cell-score' }, `${m.score1} – ${m.score2}` + (m.table != null ? ` · 🎱${m.table}` : '')),
          el('div', { class: 'cell-meta' }, (r ? r.label : '') + (m.etat === 'en_cours' ? ' · ● LIVE' : ''))));
      }
      div.append(
        el('div', { class: 'tv-next-title' }, `🔴 En direct — page ${s.page}/${s.total} (${s.items.length} matchs)`),
        grid);
    } else if (s.type === 'live') {
      const m = s.m;
      const r = t.rounds.find(rr => rr.bracket === m.bracket && rr.tour === m.tour);
      div.append(
        el('span', { class: 'tv-live-badge' }, '● EN DIRECT'),
        el('div', { class: 'tv-big', style: 'color:var(--muted)' }, `${r ? r.label : ''} · race to ${m.manches}`),
        el('div', { class: 'tv-vs' },
          el('div', {}, el('div', { class: 'p' }, m.joueur1 ? m.joueur1.pseudo : '—'), el('div', { class: 's' }, String(m.score1))),
          el('div', { class: 's', style: 'font-size:clamp(30px,6vw,70px);color:var(--muted)' }, '–'),
          el('div', {}, el('div', { class: 'p' }, m.joueur2 ? m.joueur2.pseudo : '—'), el('div', { class: 's' }, String(m.score2)))),
        m.table != null ? el('div', { class: 'tv-table' }, `🎱 Table n° ${m.table}`) : null);
    } else if (s.type === 'champion') {
      div.append(el('div', { class: 'tv-champion' }, `🏆 ${s.t.champion.pseudo}`), el('div', { class: 'tv-big', style: 'color:var(--muted)' }, 'Champion de la Pink City'));
    } else if (s.type === 'attente') {
      const inscription = !s.t || !s.t.tournoi || s.t.tournoi.statut === 'inscription'; // aucun tournoi lancé = grand QR aussi
      div.append(el('div', { class: 'tv-big' }, '🎱 ' + (inscription ? (s.t.tournoi.nom || 'Pink City Billard') : 'Le tournoi va bientôt commencer')));
      if (inscription) {
        // tournoi créé mais pas lancé: grand QR centré pour s'inscrire
        div.append(el('div', { class: 'tv-qr-big' },
          el('img', { src: '/api/qrcode.svg?text=' + encodeURIComponent(siteUrl), alt: 'QR code du site', width: 640, height: 640 }),
          el('div', { class: 'tv-big', style: 'font-size:clamp(18px,3.4vw,32px)' }, '📱 Scanne pour t\'inscrire'),
          el('div', { class: 'tv-big', style: 'color:var(--muted);font-size:clamp(14px,2.4vw,24px)' }, siteUrl.replace(/^https?:\/\//, ''))));
      } else {
        div.append(el('div', { class: 'tv-big', style: 'color:var(--muted);font-size:clamp(16px,3vw,28px)' }, 'En attente des matchs…'));
      }
    } else {
      // aucun tournoi: grand QR centré aussi
      div.append(el('div', { class: 'tv-big' }, '🎱 Aucun tournoi pour le moment'));
      div.append(el('div', { class: 'tv-qr-big' },
        el('img', { src: '/api/qrcode.svg?text=' + encodeURIComponent(siteUrl), alt: 'QR code du site', width: 640, height: 640 }),
        el('div', { class: 'tv-big', style: 'font-size:clamp(18px,3.4vw,32px)' }, '📱 Scanne pour ouvrir le site'),
        el('div', { class: 'tv-big', style: 'color:var(--muted);font-size:clamp(14px,2.4vw,24px)' }, siteUrl.replace(/^https?:\/\//, ''))));
    }
    slidesEl.append(div);
    dotsEl.append(el('span', { class: i === slideIdx ? 'on' : '' }));
  });

  clearInterval(timer);
  if (slides.length > 1) timer = setInterval(() => { slideIdx = (slideIdx + 1) % slides.length; render(); }, SLIDE_MS);
}

let prevTermine = new Set();
let celTimer = null;

function celebrateIfNew(t) {
  if (!t) return;
  const nowTermine = new Set(t.matchs.filter(m => m.etat === 'termine' || m.etat === 'forfait').map(m => m.id));
  for (const id of nowTermine) {
    if (!prevTermine.has(id)) {
      const m = t.matchs.find(x => x.id === id);
      if (m && m.gagnant) showCelebration(m);
      break; // une seule célébration à la fois
    }
  }
  prevTermine = nowTermine;
}

function showCelebration(m) {
  const cel = document.getElementById('celebration');
  document.getElementById('cel-winner').textContent = m.gagnant;
  document.getElementById('cel-score').textContent = `remporte le match ${m.score1}–${m.score2}${m.table != null ? ' · 🎱 table ' + m.table : ''}`;
  cel.classList.add('on');
  // paillettes
  const emojis = ['✨', '🎉', '⭐', '💫', '🌟'];
  for (let i = 0; i < 40; i++) {
    const sp = el('span', { class: 'sparkle' }, emojis[i % emojis.length]);
    sp.style.left = Math.random() * 100 + 'vw';
    sp.style.top = '-5vh';
    sp.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
    sp.style.animationDelay = (Math.random() * 1.5) + 's';
    cel.append(sp);
    setTimeout(() => sp.remove(), 4500);
  }
  clearTimeout(celTimer);
  celTimer = setTimeout(() => cel.classList.remove('on'), 4000);
}

async function init() {
  state = await api('/api/etat');
  if (state && state.actif) prevTermine = new Set(state.actif.matchs.filter(m => m.etat === 'termine' || m.etat === 'forfait').map(m => m.id));
  render();
  connecterSSE((s) => { const old = state; state = s; render(); if (state && state.actif) celebrateIfNew(state.actif); });
}
init();
</script>
</body>
</html>
