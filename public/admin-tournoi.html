/* ---------- Export / import JSON (backup, rejouer ailleurs) ---------- */
async function exporterJson() {
  try {
    const res = await fetch('/api/admin/tournoi/export', { headers: adminHeaders() });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || ('Erreur ' + res.status)); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: 'tournoi-export.json' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (e) { alert(e.message); }
}
async function importerJson(file) {
  try {
    const payload = JSON.parse(await file.text());
    await adminApiDestructif('/api/admin/tournoi/import', { method: 'POST', body: JSON.stringify({ payload, replace: true }) }, `importer le tournoi "${(payload && payload.tournoi && payload.tournoi.nom) || 'inconnu'}" (remplace le tournoi actif s'il y en a un)`);
    alert('✅ Tournoi importé');
    await adminInit(render); render();
  } catch (e) { alert(e.message); }
}

/* ---------- 19d. Zone de tables du tournoi (tables réservées par tournoi, mode multi-tournois) ---------- */
function zoneTablesFront19d(zone) { // « 1-4 » ou « 1,3,5-8 » (vide = toutes) ; entrée invalide -> null, le serveur refuse de toute façon
  if (typeof zone !== 'string' || !zone.trim()) return null;
  const nums19d = [];
  for (const part19d of zone.split(',')) {
    const p19d = part19d.trim();
    if (/^\d+$/.test(p19d)) nums19d.push(parseInt(p19d, 10));
    else if (/^\d+\s*-\s*\d+$/.test(p19d)) {
      const b19d = p19d.split('-').map(s => parseInt(s.trim(), 10));
      for (let n19d = Math.min(b19d[0], b19d[1]); n19d <= Math.max(b19d[0], b19d[1]); n19d++) nums19d.push(n19d);
    } else return null;
  }
  const uniq19d = [...new Set(nums19d)].filter(n19d => n19d >= 1);
  return uniq19d.length ? uniq19d : null;
}

    const sel = el('select', { id: `table-${m.id}`, style: 'width:auto' },
      el('option', { value: '' }, '🎱 Table auto (libre)'),
      t.tables.filter(tb => !zoneChoix19d || zoneChoix19d.includes(tb.numero)).map(tb => el('option', { value: tb.id, ...(occupees.has(tb.numero) ? { disabled: '' } : {}) }, `Table ${tb.numero}${occupees.has(tb.numero) ? ' (occupée)' : ''}`)));
    const overlay = el('div', { style: 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999' });
    const surEchap = (e) => { if (e.key === 'Escape') fermer(); }; // 28c: Échap ferme la modale
    const fermer = () => { overlay.remove(); document.removeEventListener('keydown', surEchap); }; // l état revient par la diffusion serveur (SSE), même pattern que la fiche joueur 17y
    const ajuster = async (mm, d1, d2) => { // 104: chaque clic sur +/- valide la correction (score absolu clampé à 0) et FERME la modale
      const s1 = Math.max(0, mm.score1 + d1), s2 = Math.max(0, mm.score2 + d2);
      try {
        await adminApi(`/api/admin/match/${mm.id}/correction`, { method: 'POST', body: JSON.stringify({ score1: s1, score2: s2, manches: mm.manches, motif: 'ajustement +/- table de marque' }) });
        fermer();
      } catch (e) { alert(e.message); }
    };
    overlay.append(el('div', { class: 'panel', style: 'max-width:440px;width:92%;max-height:92vh;overflow:auto' },
      el('h3', {}, `⚙️ ${m.bracket}${m.tour} · ${m.joueur1 ? m.joueur1.pseudo : ''} vs ${m.joueur2 ? m.joueur2.pseudo : ''}`),
      el('p', { class: 'muted small' }, `${estEnCours ? 'En cours' : 'Prêt à lancer'} · ${m.score1}-${m.score2} · race to ${m.manches}${m.table != null ? ' · table ' + m.table : ''}`),
      estEnCours ? null : el('div', { style: 'margin:12px 0' },
        el('label', { class: 'small muted' }, 'Table'),
        el('div', { class: 'row', style: 'margin-top:4px' }, sel,
          el('button', { style: 'margin-left:8px', onclick: () => { lancer(m.id, sel.value ? Number(sel.value) : null); fermer(); } }, '▶ Lancer'))),
      estEnCours ? el('div', { style: 'margin:12px 0' },
        el('label', { class: 'small muted', for: `score-${m.id}` }, '⚖️ Correction du score'), // 28a: saisie rapide, un champ prérempli au lieu des prompts
        el('div', { class: 'row', style: 'margin-top:4px;flex-wrap:wrap;gap:8px' },
          el('input', { id: `score-${m.id}`, value: `${m.score1}-${m.score2}`, placeholder: 'Score (ex : 3-2)', style: 'width:110px', onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); corriger(m); } } }),
          el('input', { id: `distance-${m.id}`, type: 'number', min: 1, max: 9, value: m.manches, title: 'Distance', style: 'width:70px', onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); corriger(m); } } }),
          el('button', { onclick: () => { corriger(m); } }, '✔ Valider')),
        el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:8px;align-items:center' }, // 104: score rapide +/-, chaque clic valide et ferme la modale
          el('span', { class: 'small muted' }, '⚖️ Score rapide :'),
          el('b', { class: 'small' }, (m.joueur1 ? m.joueur1.pseudo : '?')),
          el('button', { class: 'secondary', style: 'min-width:44px;font-size:18px', disabled: m.score1 <= 0 ? '' : null, title: '-1 ' + (m.joueur1 ? m.joueur1.pseudo : ''), onclick: () => ajuster(m, -1, 0) }, '−'),
          el('b', { style: 'min-width:2ch;text-align:center' }, String(m.score1)),
          el('button', { style: 'min-width:44px;font-size:18px', title: '+1 ' + (m.joueur1 ? m.joueur1.pseudo : ''), onclick: () => ajuster(m, 1, 0) }, '+'),
          el('span', { class: 'muted', style: 'margin:0 6px' }, '—'),
          el('b', { class: 'small' }, (m.joueur2 ? m.joueur2.pseudo : '?')),
          el('button', { class: 'secondary', style: 'min-width:44px;font-size:18px', disabled: m.score2 <= 0 ? '' : null, title: '-1 ' + (m.joueur2 ? m.joueur2.pseudo : ''), onclick: () => ajuster(m, 0, -1) }, '−'),
          el('b', { style: 'min-width:2ch;text-align:center' }, String(m.score2)),
          el('button', { style: 'min-width:44px;font-size:18px', title: '+1 ' + (m.joueur2 ? m.joueur2.pseudo : ''), onclick: () => ajuster(m, 0, 1) }, '+')),
        el('div', { class: 'row', style: 'margin-top:8px;flex-wrap:wrap;gap:8px' },
          m.score1 === 0 && m.score2 === 0 ? el('button', { class: 'secondary', onclick: () => { suspendre(m); } }, '⏸ Suspendre') : null, // 23b: possible seulement à 0 manche jouée
          el('button', { class: 'danger', onclick: () => { forfait(m, m.joueur1.id); } }, `${m.joueur1 ? m.joueur1.pseudo : ''} forfait`),
          el('button', { class: 'danger', onclick: () => { forfait(m, m.joueur2.id); } }, `${m.joueur2 ? m.joueur2.pseudo : ''} forfait`))) : null,
      el('div', { style: 'margin:12px 0' }, el('button', { class: 'secondary', style: 'width:100%', onclick: async () => { // 24a: lien public du match (même URL que les notifications push)
        try {
          const cp = clubParam17s(); // 17s: le club courant dans l URL
          const url = location.origin + '/match.html?id=' + m.id + (cp ? '&' + cp : '');
          try { await navigator.clipboard.writeText(url); alert('Lien du match copié :\n\n' + url); }
          catch (e) { prompt('Copie le lien du match :', url); }
        } catch (e) { alert(e.message); }
      } }, '🔗 Partager le match')),
      el('div', { class: 'row', style: 'justify-content:flex-end;margin-top:12px' }, el('button', { class: 'secondary', onclick: fermer }, 'Fermer'))));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fermer(); });
    document.addEventListener('keydown', surEchap); // 28c: Échap ferme aussi la modale
    document.body.append(overlay);
    (estEnCours ? document.getElementById('score-' + m.id) : sel).focus(); // 28c: autofocus sur le premier champ de la modale
  }
  function corriger(m) { // 28a: le champ UNIQUE 3-2 prérempli de la modale remplace les prompts de score ET de distance
    const brut = (val('score-' + m.id) || '').trim();
    const res = brut.match(/^(\d+)\s*-\s*(\d+)$/);
    if (!res) { alert('Score illisible : écris par exemple 3-2'); return; }
    const man = (val('distance-' + m.id) || '').trim();
    const motif = prompt('Motif :', 'correction table de marque');
    if (motif == null) return;
    adminApi(`/api/admin/match/${m.id}/correction`, { method: 'POST', body: JSON.stringify({ score1: Number(res[1]), score2: Number(res[2]), manches: Number(man) || m.manches, motif: motif || '' }) }).catch(e => alert(e.message));
  }
  async function rouvrir(m) {
    if (!confirmer(`Rouvrir le match #${m.position} ? Le résultat est annulé et les matchs suivants seront vidés.`)) return;
    try { await adminApi(`/api/admin/match/${m.id}/rouvrir`, { method: 'POST', body: '{}' }); } catch (e) { alert(e.message); }
  }
  async function simulerTout() {
    if (!confirmer('Simuler tout le tournoi (scores aléatoires) jusqu\'au champion ?')) return;
    try {
      const r = await adminApi('/api/admin/simuler', { method: 'POST', body: JSON.stringify(avecTournoiCible19c({})) }); // 90: cible = tournoi choisi dans le bandeau (19c), plus de 409 « plusieurs actifs »
      alert(`Simulation terminée : ${r.matchs_joues} matchs joués. ${r.statut === 'termine' ? '🏆 Champion : ' + r.champion : r.statut}`);
    } catch (e) { alert(e.message); }
  }
  async function terminer() {
    if (!confirmer('Terminer le tournoi maintenant ?')) return;
    const cid = val('champion');
    try { await adminApi('/api/admin/terminer', { method: 'POST', body: JSON.stringify(avecTournoiCible19c({ champion_id: cid ? Number(cid) : null })) }); } catch (e) { alert(e.message); }
  }
}

let autoOn = false;
async function sauverReservees() {
  try {
    await api('/api/admin/auto', { method: 'POST', body: JSON.stringify({
      on: !!(adminState && adminState.auto),
      table_pref: val('tablepref'),
      tables_reservees: val('tablesres'),
      reservees_tour: val('restour'),
    }) });
    alert('Enregistré ✅');
  } catch (e) { alert(e.message); }
}

async function sauverTablePref() {
  try {
    await adminApi('/api/admin/auto', { method: 'POST', body: JSON.stringify({ on: autoOn, table_pref: val('tablepref') }) });
  } catch (e) { alert(e.message); }
}
async function majTables() {
  const t = adminTournoiActif();
  if (!t) return;
  try {
    await adminApi('/api/admin/tournoi', { method: 'PUT', body: JSON.stringify(avecTournoiCible19c({
      nom: t.tournoi.nom, tetes_de_serie: t.tournoi.tetes_de_serie, nb_tables: Number(val('edit-nbtables')), ajustement_auto: t.tournoi.ajustement_auto,
      date_heure: t.tournoi.date_heure, lieu: t.tournoi.lieu,
    })) });
  } catch (e) { alert(e.message); }
}
async function toggleAuto() {
  autoOn = !autoOn;
  try {
    await adminApi('/api/admin/auto', { method: 'POST', body: JSON.stringify({ on: autoOn }) });
    const b = document.getElementById('btn-auto');
    if (b) b.textContent = t('🤖 Mode auto : ') + (autoOn ? t('ACTIF ✅') : t('inactif'));
  } catch (e) { autoOn = !autoOn; alert(e.message); }
}

async function init() {
  await adminInit(render);
  render();
}
init();
</script>
</body>
</html>
