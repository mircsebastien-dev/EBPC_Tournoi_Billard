<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes joueurs — Table de marque</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>👤 Comptes joueurs</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');
let superAdminComptes = true; // rôle plateforme (user/admin/super_admin) = super-admin seulement: bouton 👑 masqué sinon (17i: console pour super_admin)
let peutRolesClub = false, clubCtx = null; // 17g: sélecteur de rôle club (admin/opérateur) si le contexte du club le permet
let filtre = '';

async function charger() {
  const rep = await adminApi('/api/admin/comptes');
  peutRolesClub = !!(rep && rep.peut_gerer_roles && rep.club);
  clubCtx = rep ? rep.club : null;
  render(rep.comptes);
}

function render(comptes) {
  main.innerHTML = '';
  if (!adminPin && !adminCompte) { renderAdminLogin(main); return; }
  const input = el('input', {
    id: 'filtre', placeholder: '🔍 Rechercher (pseudo ou email)…', value: filtre, maxlength: 40, style: 'width:100%;max-width:340px',
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      filtre = input.value.trim().toLowerCase();
      const f = document.getElementById('filtre');
      charger().then(() => { const n = document.getElementById('filtre'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
    }
  });
  main.append(el('div', { class: 'panel', style: 'padding:10px 14px;margin-bottom:12px' }, input));
  const rows = comptes.filter(c => !filtre || c.pseudo.toLowerCase().includes(filtre) || (c.email || '').toLowerCase().includes(filtre));
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, `${rows.length} compte(s)`),
    el('p', { class: 'hero-sub' }, `${rows.filter(c => c.push_abonnements > 0).length} avec 🔔 notifs push activées`),
    rows.length === 0 ? el('p', { class: 'muted' }, 'Aucun compte.') :
    el('div', { class: 'table-wrap' }, el('table', { style: 'width:100%;border-collapse:collapse' },
      el('thead', {}, el('tr', {}, ['Pseudo', 'Email', 'Créé le', 'Dernière connexion', 'Nb inscri. tournois', 'Matchs', 'Sessions', 'Push', 'Amis', 'Actions'].map(h => el('th', { style: 'text-align:left;padding:6px 8px' }, h)))),
      el('tbody', {}, ...rows.map(c => el('tr', { style: 'border-top:1px solid var(--line)' },
        el('td', { style: 'padding:6px 8px;font-weight:700' }, c.pseudo,
          (c.role === 'super_admin' ? el('span', { class: 'chip', style: 'margin-left:6px' }, '🛡️ super-admin') : null),
          (c.role === 'admin' ? el('span', { class: 'chip', style: 'margin-left:6px' }, '👑 admin') : null),
          (c.role_club === 'admin' ? el('span', { class: 'chip', style: 'margin-left:6px' }, '👑 admin club') : null),
          (c.role_club === 'operateur' ? el('span', { class: 'chip', style: 'margin-left:6px' }, '🛠 opérateur club') : null)),
        el('td', { style: 'padding:6px 8px', title: c.email }, maskEmail(c.email)),
        el('td', { style: 'padding:6px 8px', class: 'muted small' }, (c.created_at || '').slice(0, 16).replace('T', ' ')),
        el('td', { style: 'padding:6px 8px', class: 'muted small' }, c.last_login_at ? fmtDateHeureSql(c.last_login_at) : 'jamais'),
        el('td', { style: 'padding:6px 8px;text-align:center' }, String(c.joueurs)),
        el('td', { style: 'padding:6px 8px;text-align:center' }, String(c.matchs)),
        el('td', { style: 'padding:6px 8px;text-align:center' }, String(c.sessions)),
        el('td', { style: 'padding:6px 8px;text-align:center', title: c.push_abonnements > 0 ? `${c.push_abonnements} appareil(s) avec notifs activées` : 'Aucune notification activée' },
          c.push_abonnements > 0 ? `🔔 ${c.push_abonnements}` : '—'),
        el('td', { style: 'padding:6px 8px', class: 'muted small', title: [c.amis_comptes, c.amis_pseudos].filter(Boolean).join(' · ') || 'Aucun ami' }, (() => {
          const t = [];
          if (c.amis_comptes) t.push(c.amis_comptes);
          if (c.amis_pseudos) t.push(c.amis_pseudos.split(', ').map(p => p + ' (sans compte)').join(', '));
          return t.length ? t.join(' · ') : '—';
        })()),
        el('td', { style: 'padding:6px 8px;text-align:right' },
          ...(peutRolesClub && clubCtx && c.club_id === clubCtx.id ? [el('select', { title: `Rôle de « ${c.pseudo} » sur le club ${clubCtx.slug} : admin (session admin du club, sans PIN), opérateur (routes ouvertes, confirmations et rôles refusés) ou aucun`, style: 'padding:4px 6px;font-size:13px;margin-right:6px', onchange: async (ev) => {
            const v = ev.target.value;
            if (v === (c.role_club || '')) return;
            const remettre = () => { ev.target.value = c.role_club || ''; };
            try {
              if (v === '') {
                if (!confirm(`Retirer le rôle de « ${c.pseudo} » sur le club ${clubCtx.slug} ?\nSes sessions perdront l'accès admin de ce club.`)) return remettre();
                await adminApiDestructif('/api/admin/club/compte', { method: 'DELETE', body: JSON.stringify({ compte_id: c.id }) }, `retirer le rôle club de ${c.pseudo}`);
              } else {
                if (!confirm(v === 'admin'
                  ? `Promouvoir « ${c.pseudo} » en ADMIN du club ${clubCtx.slug} ?\nSa connexion suffira pour l'admin complet de ce club, sans PIN.`
                  : `Attribuer à « ${c.pseudo} » le rôle OPÉRATEUR du club ${clubCtx.slug} ?\nRoutes admin ouvertes, confirmations destructives et gestion des rôles refusées.`)) return remettre();
                await adminApi('/api/admin/club/compte', { method: 'PUT', body: JSON.stringify({ pseudo: c.pseudo, role: v }) });
              }
              charger();
            } catch (e) { alert(e.message); remettre(); }
          } },
            el('option', { value: '', selected: c.role_club ? null : true }, 'Club : aucun'),
            el('option', { value: 'operateur', selected: c.role_club === 'operateur' ? true : null }, '🛠 Club : opérateur'),
            el('option', { value: 'admin', selected: c.role_club === 'admin' ? true : null }, '👑 Club : admin'))] : []),
          ...(superAdminComptes ? [el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px;margin-right:6px', title: c.role === 'admin' ? 'Rétrograder en simple utilisateur (le PIN restera nécessaire pour l\\u2019admin)' : 'Promouvoir administrateur (sa session suffira pour l\\u2019admin, sans PIN)', onclick: async () => {
            const cible = (c.role === 'admin' || c.role === 'super_admin') ? 'user' : 'admin'; // 17i: retrait super_admin -> user
            if (!confirm(`${cible === 'admin' ? 'Promouvoir' : 'Rétrograder'} « ${c.pseudo} » en ${cible === 'admin' ? 'admin' : 'user'} ?`)) return;
            try { await adminApi(`/api/admin/compte/${c.id}/role`, { method: 'POST', body: JSON.stringify({ role: cible }) }); charger(); }
            catch (e) { alert(e.message); }
          } }, (c.role === 'admin' || c.role === 'super_admin') ? '👑\u2193 user' : '👑 admin')] : []),
          el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px;margin-right:6px', title: 'Renommer le pseudo du compte', onclick: async () => {
            const p = prompt(`Nouveau pseudo pour « ${c.pseudo} » (min 2 caractères) :`, c.pseudo);
            if (!p || p === c.pseudo) return;
            try { await adminApi(`/api/admin/compte/${c.id}/pseudo`, { method: 'POST', body: JSON.stringify({ pseudo: p }) }); alert('✅ Pseudo changé'); charger(); }
            catch (e) { alert(e.message); }
          } }, '✏️ pseudo'),
          el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px;margin-right:6px', title: 'Changer le mot de passe du compte', onclick: async () => {
            const mdp = prompt(`Nouveau mot de passe pour « ${c.pseudo} » (min 4 caractères) :`);
            if (!mdp) return;
            try { await adminApi(`/api/admin/compte/${c.id}/password`, { method: 'POST', body: JSON.stringify({ password: mdp }) }); alert('✅ Mot de passe changé (sessions invalidées)'); }
            catch (e) { alert(e.message); }
          } }, '🔑 mdp'),
          el('button', { class: 'danger', style: 'padding:5px 10px;font-size:13px', onclick: async () => {
            if (!confirm(`Supprimer le compte « ${c.pseudo} » ?\nLes joueurs rattachés sont détachés (l'historique des matchs est conservé), les sessions et abonnements push sont supprimés.`)) return;
            try { await adminApiDestructif(`/api/admin/compte/${c.id}`, { method: 'DELETE' }, `supprimer le compte « ${c.pseudo} »`); charger(); }
            catch (e) { alert(e.message); }
          } }, ['🗑 ', 'Supprimer'])))))))));
}

async function init() {
  const ok = await adminInit(() => {});
  // le rôle global (user/admin) est un réglage super-admin: bouton 👑 réservé aux super-admins
  if (ok) { try { superAdminComptes = (await adminApi('/api/admin/super')).super_admin === true; } catch (e) { superAdminComptes = false; } }
  if (!ok) { renderAdminLogin(main); return; }
  await charger();
}
init();
</script>
</body>
</html>
