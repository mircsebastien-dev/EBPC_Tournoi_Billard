<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clubs — Table de marque</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🏛️ Clubs</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');

// appel ciblé sur un club précis (X-Club) en conservant le PIN / la session du bandeau
const clubApi = (path, slug, opts = {}) => adminApi(path, { ...opts, headers: adminHeaders({ 'X-Club': slug }) });

async function charger() {
  try {
    const { clubs } = await adminApi('/api/admin/clubs');
    render(clubs);
    if (typeof LANG !== 'undefined' && LANG !== 'fr') traduireDomStatique(main);
  } catch (e) {
    main.innerHTML = '';
    main.append(el('div', { class: 'panel' }, el('p', { class: 'muted' }, '⛔ ' + (e.status === 403
      ? 'Gestion des clubs réservée au super-admin (code global ou compte admin global).'
      : e.message))));
  }
}

async function sectionRoles(slug) {
  const zone = document.getElementById('roles-' + slug);
  if (zone) { zone.remove(); return; }
  const p = el('div', { id: 'roles-' + slug, class: 'panel', style: 'margin-top:8px' });
  main.append(p);
  try {
    const { comptes } = await clubApi('/api/admin/club/comptes', slug);
    p.append(el('h2', {}, `Rôles du club « ${slug} »`));
    if (!comptes.length) p.append(el('p', { class: 'muted' }, 'Aucun compte rattaché.'));
    for (const x of comptes) {
      p.append(el('div', { class: 'row', style: 'align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap' },
        el('strong', {}, x.pseudo),
        el('span', { class: 'muted' }, ' · ' + (x.role === 'operateur' ? 'Opérateur' : 'Administrateur')),
        el('button', { class: 'secondary', style: 'padding:4px 10px;font-size:13px', onclick: async () => {
          try {
            await adminApiDestructif('/api/admin/club/compte', { method: 'DELETE', headers: adminHeaders({ 'X-Club': slug }), body: JSON.stringify({ compte_id: x.compte_id }) }, `retirer le rôle de ${x.pseudo}`);
            charger().then(() => sectionRoles(slug));
          } catch (e) { alert(e.message); }
        } }, 'Retirer')));
    }
    const addPseudo = el('input', { placeholder: 'Pseudo du compte', maxlength: 24, style: 'width:180px' });
    const addRole = el('select', {}, el('option', { value: 'admin' }, 'Administrateur'), el('option', { value: 'operateur' }, 'Opérateur'));
    p.append(el('div', { class: 'row', style: 'flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px' },
      el('span', {}, 'Attribuer :'), addPseudo, addRole,
      el('button', { onclick: async () => {
        if (!addPseudo.value.trim()) { alert('Pseudo requis.'); return; }
        try {
          await clubApi('/api/admin/club/compte', slug, { method: 'PUT', body: JSON.stringify({ pseudo: addPseudo.value.trim(), role: addRole.value }) });
          charger().then(() => sectionRoles(slug));
        } catch (e) { alert(e.message); }
      } }, '➕ Ajouter')));
    if (typeof LANG !== 'undefined' && LANG !== 'fr') traduireDomStatique(p);
  } catch (e) { p.append(el('p', { class: 'muted' }, e.message)); }
}

function rowClub(c, estDefaut) {
  return el('tr', { style: 'border-top:1px solid var(--line)' },
    el('td', { style: 'padding:6px 8px' }, el('strong', {}, c.nom), el('div', { class: 'muted', style: 'font-size:12px' }, c.slug)),
    el('td', { style: 'padding:6px 8px' }, c.actif ? '✅ Actif' : '⛔ Inactif'),
    el('td', { style: 'padding:6px 8px' }, c.pin_propre ? '🔒 oui' : 'non (code global)'),
    el('td', { style: 'padding:6px 8px' }, String(c.nb_comptes || 0)),
    el('td', { style: 'padding:6px 8px;white-space:nowrap' }, String(c.created_at || '').slice(0, 10)),
    el('td', { style: 'padding:6px 8px;white-space:nowrap' },
      el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px;margin-right:6px', onclick: async () => {
        const nom = prompt(`Nouveau nom du club « ${c.nom} » :`);
        if (!nom || !nom.trim()) return;
        try { await adminApi('/api/admin/club', { method: 'PUT', body: JSON.stringify({ slug: c.slug, nom: nom.trim() }) }); charger(); }
        catch (e) { alert(e.message); }
      } }, '✏️ Renommer'),
      el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px;margin-right:6px', onclick: async () => {
        const pin = prompt(`Nouveau code PIN du club « ${c.nom} » (4 à 8 chiffres) :`);
        if (!pin || !pin.trim()) return;
        try { await adminApi('/api/admin/club', { method: 'PUT', body: JSON.stringify({ slug: c.slug, pin: pin.trim(), confirm_pin: adminPin }) }); charger(); }
        catch (e) { alert(e.message); }
      } }, '🔒 Code PIN'),
      el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px;margin-right:6px', onclick: async () => {
        try { await adminApi('/api/admin/club', { method: 'PUT', body: JSON.stringify({ slug: c.slug, actif: !c.actif, confirm_pin: adminPin }) }); charger(); }
        catch (e) { alert(e.message); }
      } }, c.actif ? '⛔ Désactiver' : '✅ Activer'),
      el('button', { class: 'secondary', style: 'padding:5px 10px;font-size:13px', onclick: () => sectionRoles(c.slug) }, '👥 Rôles'),
      ...(estDefaut ? [] : [el('button', { class: 'danger', style: 'padding:5px 10px;font-size:13px;margin-left:6px', onclick: async () => {
        try {
          await adminApiDestructif('/api/admin/club', { method: 'DELETE', body: JSON.stringify({ slug: c.slug }) }, `supprimer définitivement le club « ${c.nom} » (rôles purgés)`);
          charger();
        } catch (e) { alert(e.message); }
      } }, 'Supprimer')])));
}

function render(clubs) {
  main.innerHTML = '';
  if (!adminPin && !adminCompte) { renderAdminLogin(main); return; }
  // création d un club (super-admin)
  const slugI = el('input', { placeholder: 'slug (2-30 : lettres minuscules, chiffres, tirets)', maxlength: 30, style: 'width:250px' });
  const nomI = el('input', { placeholder: 'Nom du club', maxlength: 80, style: 'width:220px' });
  const pinI = el('input', { placeholder: 'Code PIN du club (4 à 8 chiffres, optionnel)', inputmode: 'numeric', maxlength: 8, style: 'width:270px' });
  const creer = el('button', { onclick: async () => {
    const slg = slugI.value.trim().toLowerCase();
    const nom = nomI.value.trim();
    if (!slg || !nom) { alert('Slug et nom du club requis.'); return; }
    try {
      await adminApi('/api/admin/club', { method: 'POST', body: JSON.stringify({ slug: slg, nom, pin: pinI.value.trim() || undefined }) });
      charger();
    } catch (e) { alert(e.message); }
  } }, '➕ Créer un club');
  main.append(el('div', { class: 'panel' }, el('h2', {}, 'Créer un club'), el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px' }, slugI, nomI, pinI, creer)));
  // liste des clubs
  const thead = el('thead', {}, el('tr', {}, ['Club', 'Actif', 'Code PIN propre', 'Comptes rattachés', 'Créé le', 'Actions'].map(h => el('th', { style: 'text-align:left;padding:6px 8px' }, h))));
  const tbody = el('tbody', {}, ...clubs.map((c, i) => rowClub(c, i === 0)));
  const table = el('div', { class: 'table-wrap' }, el('table', { style: 'width:100%;border-collapse:collapse' }, thead, tbody));
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, `${clubs.length} club(s)`),
    clubs.length === 0 ? el('p', { class: 'muted' }, 'Aucun club.') : table));
}

async function init() {
  const ok = await adminInit(() => {});
  if (!ok) { renderAdminLogin(main); return; }
  await charger();
}
init();
</script>
</body>
</html>
