<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats joueurs — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const main = document.getElementById('main');
document.getElementById('nav').append(nav('stats'));

async function init() {
  main.innerHTML = '';
  const { joueurs } = await api('/api/stats-joueurs');
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, '📊 Statistiques joueurs (tous les tournois)'),
    el('p', { class: 'muted' }, `${joueurs.length} joueurs recensés`)));
  if (joueurs.length === 0) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', { class: 'muted' }, 'Aucune statistique pour le moment.')));
    return;
  }
  joueurs.sort((a, b) => (b.points || 0) - (a.points || 0) || b.gagnes - a.gagnes);
  const rang = (p) => 1 + joueurs.filter(q => (q.points || 0) > (p.points || 0)).length; // ex-aequo: 1,1,1,4…
  main.append(el('div', { class: 'panel' },
    el('table', { class: 'audit' },
      el('tr', {}, el('th', {}, '#'), el('th', {}, 'Joueur'), el('th', {}, 'Tournois'), el('th', {}, '🏆 Titres'), el('th', {}, 'Joués'), el('th', {}, 'Gagnés'), el('th', {}, 'Perdus'), el('th', {}, '% victoires'), el('th', {}, '⭐ Pts'), el('th', {}, 'Manches'), el('th', {}, '💥 Run-outs')),
      ...joueurs.map((p) => el('tr', {},
        el('td', {}, String(rang(p))),
        el('td', { style: 'font-weight:700' }, el('a', { href: `/joueur.html?id=${p.id}`, style: 'color:var(--pink-soft)' }, p.pseudo)),
        el('td', {}, String(p.tournois)),
        el('td', {}, p.titres > 0 ? `🏆 ${p.titres}` : '—'),
        el('td', {}, String(p.joues)),
        el('td', { style: 'color:var(--green)' }, String(p.gagnes)),
        el('td', {}, String(p.perdus)),
        el('td', { style: 'font-weight:700;color:var(--pink-soft)' }, `${p.pct} %`),
        el('td', { style: 'font-weight:800;color:var(--gold)' }, String(p.points || 0)),
        el('td', {}, String(p.manches || 0)), el('td', {}, p.runouts ? `💥 ${p.runouts}` : '—'))))));
}
init();
</script>
</body>
</html>
