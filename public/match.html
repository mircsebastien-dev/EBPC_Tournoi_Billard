<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Match en direct</h1>
  <nav><a href="/suivi.html">← Mes matchs</a><a href="/tv.html">📺 TV</a><a href="/tableau.html">🗺 Tableau</a></nav>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const matchId = Number(params.get('id'));
const joueurId = Number(params.get('joueur')) || Number(localStorage.getItem('ebpc_joueur_id') || 0);
let state = null;
const main = document.getElementById('main');

function monMatch() {
  const t = state && state.actif;
  if (!t) return null;
  return t.matchs.find(m => m.id === matchId) || null;
}

function render() {
  main.innerHTML = '';
  const m = monMatch();
  if (!m) { main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', {}, 'Match introuvable.'))); return; }
  const compteId = (state && state.compte && state.compte.id) || 0;
  const estMoi = (j) => j && (j.id === joueurId || (compteId && j.compte_id === compteId));
  const moi = estMoi(m.joueur1) ? m.joueur1 : (estMoi(m.joueur2) ? m.joueur2 : null);
  const adv = estMoi(m.joueur1) ? m.joueur2 : m.joueur1;
  const peutJouer = (m.etat === 'en_cours' || m.etat === 'pret') && moi;

  const btnScore = (target, label, plus) => el('button', {
    class: 'btn-score ' + (plus ? '' : 'secondary'),
    onclick: () => envoyer(target, plus),
  }, label);

  const carte = el('div', { class: 'panel' },
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
      el('h2', {}, `Match #${m.position}`),
      badgeEtat(m.etat)),
    m.table != null
      ? el('div', { class: 'table-info' }, `📍 Va à la table n° ${m.table}`)
      : el('p', { class: 'muted', style: 'text-align:center' }, 'En attente de la table…'),
    el('div', { class: 'muted small', style: 'text-align:center' },
      m.started_at ? `Début : ${fmtHeureSql(m.started_at)}` : '',
      m.started_at && m.ended_at && m.duree_s != null ? ` · Durée : ${fmtDuree(m.duree_s)}` : ''),
    el('div', { class: 'scoreboard' },
      el('div', {}, el('div', { class: 'p' }, m.joueur1 ? el('a', { href: `/joueur.html?id=${m.joueur1.id}`, style: 'color:inherit;text-decoration:none' }, (m.casseur && m.casseur.id === m.joueur1.id ? '⚪ ' : '') + m.joueur1.pseudo) : '—'), el('div', { class: 's' }, String(m.score1))),
      el('div', { class: 'mid' }, `race to ${m.manches}`),
      el('div', {}, el('div', { class: 'p' }, m.joueur2 ? el('a', { href: `/joueur.html?id=${m.joueur2.id}`, style: 'color:inherit;text-decoration:none' }, (m.casseur && m.casseur.id === m.joueur2.id ? '⚪ ' : '') + m.joueur2.pseudo) : '—'), el('div', { class: 's' }, String(m.score2)))),
    peutJouer && moi && m.etat === 'en_cours' && !m.casseur
      ? el('p', { class: 'muted small', style: 'text-align:center' }, 'La saisie des points est bloquée tant que le tirage à la bande n\'est pas fait.') : null,
    peutJouer && moi && m.etat === 'en_cours' && !m.casseur
      ? el('div', { class: 'panel', style: 'text-align:center;margin-top:10px' },
          el('h3', {}, '🎲 Tirage à la bande'),
          el('p', { class: 'muted small' }, 'Chaque joueur fait rouler une bille sur le tapis : le plus proche de la bande remporte le tirage et casse en premier (⚪).'),
          el('div', { class: 'row', style: 'justify-content:center' },
            el('button', { onclick: () => api(`/api/match/${m.id}/bande`, { method: 'POST', body: JSON.stringify({ joueur_id: m.joueur1.id }) }).then(() => location.reload()).catch(e => alert(e.message)) }, `🎱 ${m.joueur1.pseudo} casse`),
            el('button', { class: 'secondary', onclick: () => api(`/api/match/${m.id}/bande`, { method: 'POST', body: JSON.stringify({ joueur_id: m.joueur2.id }) }).then(() => location.reload()).catch(e => alert(e.message)) }, `🎱 ${m.joueur2.pseudo} casse`)))
      : null,
    peutJouer && moi && adv && m.casseur ? el('div', { class: 'score-actions' },
      // aligné avec le scoreboard : joueur1 à gauche, joueur2 à droite
      el('div', { class: 'score-col' },
        el('div', { class: 'score-col-label' }, `✅ ${m.joueur1.pseudo}${estMoi(m.joueur1) ? ' (toi)' : ''}`),
        btnScore(m.joueur1.id, '+1 manche', true),
        btnScore(m.joueur1.id, '−1 manche', false),
        btnRunout(m.joueur1.id, 'casse'), btnRunout(m.joueur1.id, 'reprise')),
      el('div', { class: 'score-col' },
        el('div', { class: 'score-col-label' }, `✅ ${m.joueur2.pseudo}${estMoi(m.joueur2) ? ' (toi)' : ''}`),
        btnScore(m.joueur2.id, '+1 manche', true),
        btnScore(m.joueur2.id, '−1 manche', false),
        btnRunout(m.joueur2.id, 'casse'), btnRunout(m.joueur2.id, 'reprise')))
      : null,
    (m.etat === 'termine' || m.etat === 'forfait')
      ? el('p', { style: 'text-align:center;font-size:24px;font-weight:800;color:var(--green)' }, `🏁 ${m.gagnant || '—'} remporte le match`)
      : null,
    m.etat === 'pret' ? el('p', { class: 'muted', style: 'text-align:center' }, 'La table de marque va lancer le match…') : null,
    !moi && m.etat !== 'termine' ? el('p', { class: 'muted small', style: 'text-align:center' }, 'Consultation seule — tu ne joues pas ce match.') : null);
  main.append(carte);
}

const btnRunout = (target, kind) => el('button', {
  class: 'btn-score runout',
  onclick: () => envoyerRunout(target, kind),
}, kind === 'casse' ? '💥 Casse ferme' : '🔄 Reprise ferme');

async function envoyerRunout(targetId, kind) {
  try {
    await api(`/api/match/${matchId}/runout`, { method: 'POST', body: JSON.stringify({ joueur_id: targetId, kind }) });
  } catch (e) { alert(e.message); }
}

async function envoyer(targetId, plus) {
  try {
    if (plus) await api(`/api/match/${matchId}/manche`, { method: 'POST', body: JSON.stringify({ joueur_id: targetId }) });
    else await api(`/api/match/${matchId}/retirer`, { method: 'POST', body: JSON.stringify({ joueur_id: targetId }) });
  } catch (e) { alert(e.message); }
}

async function init() {
  state = await api('/api/etat');
  render();
  connecterSSE((s) => { state = s; render(); });
}
init();
</script>
</body>
</html>
