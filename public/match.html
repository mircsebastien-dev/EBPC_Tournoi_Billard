<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Match en direct</h1>
  <nav><a href="/suivi.html">← Mes matchs</a><a href="/tv.html">📺 TV</a></nav>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
const matchId = Number(params.get('id'));
const joueurId = Number(params.get('joueur')) || Number(localStorage.getItem('ebpc_joueur_id') || 0);
let state = null;
const main = document.getElementById('main');

function monMatch() {
  if (!state || !state.tournoi) return null;
  return state.tournoi.matchs.find(m => m.id === matchId) || null;
}

function render() {
  main.innerHTML = '';
  const m = monMatch();
  if (!m) { main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', {}, 'Match introuvable.'))); return; }
  const moi = m.joueur1 && m.joueur1.id === joueurId ? m.joueur1 : (m.joueur2 && m.joueur2.id === joueurId ? m.joueur2 : null);
  const peutJouer = m.etat === 'en_cours' && moi;

  const carte = el('div', { class: 'panel' },
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
      el('h2', {}, `Match #${m.position}`),
      badgeEtat(m.etat)),
    m.table != null
      ? el('div', { class: 'table-info' }, `📍 Va à la table n° ${m.table}`)
      : el('p', { class: 'muted', style: 'text-align:center' }, 'En attente de la table…'),
    el('div', { class: 'scoreboard' },
      el('div', {}, el('div', { class: 'p' }, m.joueur1 ? m.joueur1.pseudo : '—'), el('div', { class: 's' }, String(m.score1))),
      el('div', { class: 'mid' }, `race<br>to ${m.manches}`),
      el('div', {}, el('div', { class: 'p' }, m.joueur2 ? m.joueur2.pseudo : '—'), el('div', { class: 's' }, String(m.score2)))),
    peutJouer
      ? el('button', { class: 'btn-manche', onclick: envoyerManche }, `✅ J'ai gagné la manche${moi.pseudo ? ` (${moi.pseudo})` : ''}`)
      : null,
    (m.etat === 'termine' || m.etat === 'forfait')
      ? el('p', { style: 'text-align:center;font-size:24px;font-weight:800;color:var(--green)' }, `🏁 ${m.gagnant || '—'} remporte le match`)
      : null,
    m.etat === 'pret' ? el('p', { class: 'muted', style: 'text-align:center' }, 'La table de marque va lancer le match…') : null,
    !moi && m.etat !== 'termine' ? el('p', { class: 'muted small', style: 'text-align:center' }, 'Consultation seule — tu ne joues pas ce match.') : null);
  main.append(carte);
}

async function envoyerManche() {
  try {
    await api(`/api/match/${matchId}/manche`, { method: 'POST', body: JSON.stringify({ joueur_id: joueurId }) });
  } catch (e) { alert(e.message); }
}

async function init() {
  state = (await api('/api/etat')).tournoi;
  render();
  connecterSSE((s) => { state = s.tournoi; render(); });
}
init();
</script>
</body>
</html>
