<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournoi archivé — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
.bracket-scroll { overflow-x: auto; padding-bottom: 10px; }
.bracket { display: flex; gap: 46px; align-items: stretch; min-width: max-content; position: relative; }
.bracket-col { display: block; min-width: 220px; position: relative; z-index: 1; }
.bracket-col h3 { position: sticky; top: 0; }
.bracket-col h3 { text-align: center; margin-bottom: 8px; }
.bracket-col.lb h3 { color: #ff8fb8; }
.bracket-col.wb h3 { color: var(--pink-soft); }
.bracket-col.finale h3 { color: var(--gold); }
.node { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 6px 0; font-size: 14px; min-width: 200px; }
.node.done { border-color: rgba(46, 230, 168, 0.65); box-shadow: 0 0 10px rgba(46, 230, 168, 0.18); }
.node .nj { display: flex; justify-content: space-between; gap: 8px; }
.node .nj.win { color: var(--green); font-weight: 700; }
.node .nj .sc { color: var(--pink-soft); font-weight: 700; }
.node .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#bracket-svg { position: absolute; top: 0; left: 0; z-index: 3; pointer-events: none; overflow: visible; }
#bracket-svg path { stroke: rgba(255, 122, 181, 0.85); stroke-width: 3; fill: none; }
#bracket-svg path.halo { stroke: rgba(214,51,108,.15); stroke-width: 9; }
#bracket-svg path.done { stroke: rgba(46, 230, 168, 0.9); stroke-width: 3; }
#bracket-svg path.done.halo { stroke: rgba(46, 230, 168, 0.2); stroke-width: 9; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
</style>
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
document.getElementById('nav').append(nav('hist'));
const main = document.getElementById('main');
const tournoiId = Number(new URLSearchParams(location.search).get('id'));

// Liste des matchs du tournoi (historique) avec recherche par joueur (préfixe, casse-insensible)
let filtreJoueur = '';
function renderListeTournoi(container, t) {
  container.innerHTML = '';
  const input = el('input', {
    id: 'filtre-joueur', placeholder: '🔍 Surligner un joueur (ex: seb) — Entrée pour valider', value: filtreJoueur, maxlength: 24,
    style: 'width:100%;max-width:340px',
  });
  // validation par Entrée seulement (sinon le re-render fait perdre le focus à la saisie)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      filtreJoueur = input.value.trim().toLowerCase();
      renderListeTournoi(container, t);
      const f = container.querySelector('#filtre-joueur'); // garder le focus après le re-render
      if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }
  });
  container.append(el('div', { class: 'panel', style: 'padding:10px 14px;margin-bottom:12px' }, input));
  const matchJoueur = (m) => !filtreJoueur
    || (m.joueur1 && m.joueur1.pseudo.toLowerCase().startsWith(filtreJoueur))
    || (m.joueur2 && m.joueur2.pseudo.toLowerCase().startsWith(filtreJoueur));
  const byKey = {};
  for (const m of t.matchs) (byKey[m.bracket + m.tour] = byKey[m.bracket + m.tour] || []).push(m);
  const rounds = t.rounds || [];
  const ordered = [
    ...rounds.filter(r => r.bracket === 'WB'),
    ...rounds.filter(r => r.bracket === 'LB'),
    ...rounds.filter(r => r.bracket === 'F'),
  ];
  for (const r of ordered) {
    const matchs = (byKey[r.bracket + r.tour] || []).sort((a, b) => a.position - b.position);
    if (!matchs.length) continue;
    container.append(el('div', { class: 'round' },
      el('h3', {}, `${r.label} · race to ${r.manches}`),
      el('div', { class: 'matchs-grid' }, ...matchs.map(m => matchCard(m, { hit: matchJoueur(m) })))));
  }
}

async function init() {
  main.innerHTML = '';
  try {
    const data = await api(`/api/tournois/${tournoiId}`);
    const t = data.tournoi;
    main.append(el('div', { class: 'panel' },
      el('div', { class: 'hero-title' }, `${t.tournoi.nom}`),
      el('p', { class: 'hero-sub' },
        `${t.tournoi.created_at.slice(0, 10)} · ${t.tournoi.regle} · ${t.tournoi.taille} joueurs · ${t.tournoi.format === 'double' ? 'DKO ' + t.tournoi.dko_tours : 'élim. directe'} · ${t.matchs.length} matchs`),
      t.champion ? el('p', { style: 'font-size:24px;font-weight:800;color:var(--gold)' }, `🏆 Champion : ${t.champion.pseudo}`) : null,
    ));
    renderListeTournoi(main, t);
    for (const p of renderStatsPanel(t.stats, '📊 Statistiques du tournoi', 50) || []) main.append(p);
  } catch (e) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', {}, e.message)));
  }
}
init();
</script>
</body>
</html>
