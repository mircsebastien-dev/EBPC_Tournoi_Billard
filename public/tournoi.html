<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournoi archivé — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<style>
.bracket-scroll { overflow-x: auto; padding-bottom: 10px; }
.bracket { display: flex; gap: 46px; align-items: stretch; min-width: max-content; position: relative; }
.bracket-col { display: block; min-width: 220px; position: relative; z-index: 1; }
.bracket-col h3 { position: sticky; top: 0; }
.bracket-col h3 { text-align: center; margin-bottom: 8px; }
.bracket-col.lb h3 { color: #ff8fb8; }
.bracket-col.wb h3 { color: var(--pink-soft); }
.bracket-col.finale h3 { color: var(--gold); }
.node { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 6px 0; font-size: 14px; min-width: 200px; }
.node.done { opacity: 0.8; }
.node .nj { display: flex; justify-content: space-between; gap: 8px; }
.node .nj.win { color: var(--green); font-weight: 700; }
.node .nj .sc { color: var(--pink-soft); font-weight: 700; }
.node .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#bracket-svg { position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none; overflow: visible; }
#bracket-svg path { stroke: rgba(255, 122, 181, 0.55); stroke-width: 2.5; fill: none; }
#bracket-svg path.done { stroke: rgba(46, 230, 168, 0.75); stroke-width: 2.5; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
</style>
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
document.getElementById('nav').append(nav('hist'));
const main = document.getElementById('main');
const tournoiId = Number(new URLSearchParams(location.search).get('id'));

async function init() {
  main.innerHTML = '';
  try {
    const data = await api(`/api/tournois/${tournoiId}`);
    const t = data.tournoi;
    main.append(el('div', { class: 'panel' },
      el('div', { class: 'hero-title' }, `🗂 ${t.tournoi.nom}`),
      el('p', { class: 'hero-sub' },
        `${t.tournoi.created_at.slice(0, 10)} · ${t.tournoi.regle} · ${t.tournoi.taille} joueurs · ${t.tournoi.format === 'double' ? 'DKO ' + t.tournoi.dko_tours : 'élim. directe'} · ${t.matchs.length} matchs`),
      t.champion ? el('p', { style: 'font-size:24px;font-weight:800;color:var(--gold)' }, `🏆 Champion : ${t.champion.pseudo}`) : null,
      el('div', { class: 'legend' },
        el('span', { class: 'chip' }, '⬅ Loser bracket en miroir (tour 1 collé au WB)'),
        el('span', { class: 'chip' }, 'Tours WB au centre'),
        el('span', { class: 'chip' }, '🏁 Tableau final à droite'),
        el('span', { class: 'chip' }, 'Vert = joué'))));
    renderBracket(main, t, { readonly: true });
    for (const p of renderStatsPanel(t.stats, '📊 Statistiques du tournoi', 50) || []) main.append(p);
  } catch (e) {
    main.append(el('div', { class: 'panel', style: 'text-align:center' }, el('p', {}, e.message)));
  }
}
init();
</script>
</body>
</html>
