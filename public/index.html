<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Ball Pink City — Tournoi</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('home'));
const main = document.getElementById('main');
let state = null;

// 17n: bannière du club en tête de l accueil (aucune bannière configurée -> rien ne s affiche)
(function () {
  const boite17n = document.createElement('div');
  boite17n.style.cssText = 'max-width:1100px;margin:14px auto -4px;padding:0 18px';
  const img17n = document.createElement('img');
  img17n.alt = 'Bannière du club';
  img17n.style.cssText = 'width:100%;height:auto;max-height:230px;object-fit:cover;border-radius:8px;display:none';
  img17n.onload = function () { img17n.style.display = 'block'; };
  img17n.src = '/api/club-banniere' + qsClub17n();
  boite17n.appendChild(img17n);
  if (main) document.body.insertBefore(boite17n, main);
})();

// 17v. Suggestions de clubs au premier écran : un visiteur SANS club mémorisé découvre les clubs
// actifs de la plateforme en cartes (icône 17t + nom) ; un clic mémorise le club (ouvrirClub17v)
// et recharge l accueil dans son contexte. Rien en mono-club ni si un club est déjà mémorisé.
(function () {
  try { if (localStorage.getItem(CLUB_KEY)) return; } catch (e) {}
  const boite17v = document.createElement('div');
  boite17v.id = 'clubs-17v';
  boite17v.style.cssText = 'max-width:1100px;margin:14px auto -4px;padding:0 18px';
  (async function () {
    let clubs17v = [];
    try { clubs17v = (await api('/api/clubs')).clubs || []; } catch (e) { return; }
    if (clubs17v.length < 2) return; // mono-club : rien ne change
    const titre17v = document.createElement('h2');
    titre17v.style.cssText = 'font-size:20px;margin:6px 0 10px';
    titre17v.textContent = t('Choisis ton club');
    const rangee17v = document.createElement('div');
    rangee17v.style.cssText = 'display:flex;flex-wrap:wrap;gap:12px';
    boite17v.append(titre17v, rangee17v);
    for (const c of clubs17v) {
      const carte17v = document.createElement('a');
      carte17v.href = '/?club=' + encodeURIComponent(c.slug);
      carte17v.className = 'panel';
      carte17v.style.cssText = 'flex:1 1 200px;min-width:180px;max-width:420px;display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit';
      const icone17v = document.createElement('img');
      icone17v.alt = 'Icône de ' + c.nom;
      icone17v.src = '/icone-' + encodeURIComponent(c.slug) + '.png'; // 17t : chemin par club, repli générique côté serveur
      icone17v.style.cssText = 'width:42px;height:42px;border-radius:8px;object-fit:cover;flex:0 0 auto';
      icone17v.onerror = function () { icone17v.remove(); };
      const nom17v = document.createElement('div');
      nom17v.style.cssText = 'font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
      nom17v.textContent = c.nom;
      carte17v.append(icone17v, nom17v);
      carte17v.addEventListener('click', function (e) { e.preventDefault(); ouvrirClub17v(c.slug); });
      rangee17v.append(carte17v);
    }
    if (main) document.body.insertBefore(boite17v, main);
  })();
})();

function render() {
  main.innerHTML = '';
  const t = state && state.actif;
  if (!t) {
    main.append(el('div', { class: 'panel', style: 'text-align:center;padding:40px 20px' },
      el('div', { class: 'hero-title' }, '🎱 Aucun tournoi pour le moment'),
      el('p', { class: 'muted' }, 'Revenez bientôt !')));
    // sans tournoi actif : fil du dernier tournoi terminé (la finale et le champion restent lisibles)
    main.append(el('div', { id: 'fil-panneau' }));
    chargerFilDernier();
    return;
  }
  const tn = t.tournoi;

  // ---- Affiche du tournoi à venir (poster auto-généré, phase inscription) ----
  if (tn.statut === 'inscription') {
    const inscrits = t.joueurs.length;
    const restantes = Math.max(0, tn.taille - inscrits);
    const pct = Math.max(4, Math.min(100, Math.round((inscrits / tn.taille) * 100)));
    main.append(el('div', { class: 'panel poster' },
      el('div', { class: 'poster-info' },
        el('span', { class: 'poster-eyebrow' }, 'Inscriptions ouvertes'),
        el('div', { class: 'hero-title poster-title' }, tn.nom),
        (tn.date_heure || tn.lieu) ? el('p', { class: 'poster-when' },
          `${tn.date_heure ? fmtDateHeure(tn.date_heure) : ''}${tn.date_heure && tn.lieu ? '  ·  ' : ''}${tn.lieu ? tn.lieu : ''}`) : null,
        el('div', { class: 'row', style: 'justify-content:flex-start;flex-wrap:wrap' },
          el('span', { class: 'chip' }, tn.regle === 'blackball' ? 'Blackball' : 'Ultimate'),
          el('span', { class: 'chip' }, tn.format === 'double' ? `Double KO (${tn.dko_tours || 1} tour${(tn.dko_tours || 1) > 1 ? 's' : ''})` : 'Élimination directe'),
          el('span', { class: 'chip' }, `Tableau de ${tn.taille}`)),
        el('div', { class: 'poster-fill' },
          el('div', { class: 'poster-bar' }, el('div', { style: `width:${pct}%` })),
          el('p', { class: 'muted small', style: 'margin:8px 0 0' },
            restantes > 0 ? `${inscrits}/${tn.taille} inscrits · ${restantes} place${restantes > 1 ? 's' : ''} restante${restantes > 1 ? 's' : ''}` : `Complet · ${inscrits}/${tn.taille} inscrits`))),
      el('div', { class: 'poster-ball', 'aria-hidden': 'true' }, el('div', { class: 'poster-ball-num' }, '8'))));
  } else {
    main.append(el('div', { class: 'panel', style: 'text-align:center' },
      el('div', { class: 'hero-title' }, tn.nom),
      (tn.date_heure || tn.lieu) ? el('p', { style: 'font-size:clamp(18px,4.5vw,24px);font-weight:800;color:var(--gold);margin:8px 0' },
        `${tn.date_heure ? fmtDateHeure(tn.date_heure) : ''}${tn.date_heure && tn.lieu ? '  ·  ' : ''}${tn.lieu ? tn.lieu : ''}`) : null,
      el('div', { class: 'row', style: 'justify-content:center' },
        el('span', { class: `badge ${tn.statut}` }, tn.statut === 'en_cours' ? '🔴 En cours' : '🏁 Terminé'),
        el('span', { class: 'chip' }, tn.regle === 'blackball' ? 'Blackball' : 'Ultimate'),
        el('span', { class: 'chip' }, `tableau ${tn.taille}`))));
  }

  // ---- Inscription (si ouverte) ----
  if (tn.statut === 'inscription') {
    // ---- Compte connecté : bouton d'inscription en 1 clic avec le pseudo du compte ----
    // (pas de formulaire anonyme proposé : l'inscription passe par le compte)
    const compte = state.compte;
    if (compte) {
      const deja = t.joueurs.find(j => j.compte_id === compte.id);
      main.append(el('div', { class: 'panel', style: 'text-align:center' },
        el('p', {}, `👤 Connecté en tant que `, el('b', {}, compte.pseudo), ` — `, el('a', { href: '/compte.html' }, 'gérer mon compte')),
        deja
          ? el('div', {},
              el('p', { style: 'color:var(--green);font-weight:700' }, `✅ Inscrit (${deja.statut === 'paye' ? 'payé' : 'en attente de paiement'})`),
              deja.statut === 'paye'
                ? el('p', { class: 'muted small', style: 'margin-top:6px' }, '💰 Déjà payé : la désinscription se fait auprès de la table de marque (remboursement à voir avec le club).')
                : el('div', {},
                    el('button', { class: 'secondary', style: 'width:100%;max-width:420px;margin-top:8px', onclick: desinscrireCompte }, 'Me désinscrire'),
                    el('p', { class: 'muted small', style: 'margin-top:6px' }, 'Inscrit par erreur ? Tu peux te désinscrire tant que les inscriptions sont ouvertes et que tu n\'as pas payé.')))
          : el('button', { style: 'width:100%;max-width:420px', onclick: inscrireCompte }, `M'inscrire à « ${tn.nom} » en tant que ${compte.pseudo}`)));
    } else {
      main.append(el('div', { class: 'panel', style: 'text-align:center' },
        el('p', { class: 'muted small' }, '💡 Crée un compte (pseudo + email + mot de passe) pour t\'inscrire en 1 clic et retrouver tes stats : ', el('a', { href: '/compte.html' }, '👤 Mon compte'))));
      const input = el('input', { id: 'pseudo', placeholder: 'Ton pseudo', maxlength: 40, autocomplete: 'off' });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') inscrire(); });
      main.append(el('div', { class: 'panel' },
        el('div', { class: 'row' },
          el('div', {}, input),
          el('div', { style: 'flex:0 0 auto' }, el('button', { onclick: inscrire }, "S'inscrire")))));
    }
    // compteur + liste des inscrits (connecté ou non)
    main.append(el('div', { class: 'panel' },
      el('p', { class: 'muted small', style: 'margin:0;text-align:center' }, `${t.joueurs.length}/${tn.taille} inscrits · ${t.joueurs.filter(j => j.statut === 'paye').length} payés`),
      t.joueurs.length > 0 ? el('div', { class: 'liste-joueurs', style: 'margin-top:12px' },
        t.joueurs.map(j => el('a', { class: 'chip', href: `/joueur.html?id=${j.id}`, style: 'text-decoration:none;color:var(--text)' }, `${j.tete_de_serie ? '#' + j.tete_de_serie + ' ' : ''}${j.pseudo}${j.statut === 'paye' ? ' ✅' : ''}`))) : null));
  }

  // ---- Uniquement les matchs EN COURS ----
  const enCours = t.matchs.filter(m => m.etat === 'en_cours');
  if (enCours.length > 0) {
    main.append(el('div', { class: 'panel' },
      el('h2', {}, `🔴 En direct (${enCours.length})`),
      el('div', { class: 'matchs-grid' }, enCours.map(m => matchCard(m, { t, onClick: () => location.href = matchUrl(m) })))));
  }

  // ---- Fil du tournoi (3 dernières lignes, « Voir tout » pour étendre) ----
  const pFil = panneauFil(t);
  if (pFil) main.append(pFil);

  // lien vers le tableau complet (rose, comme les autres liens de contenu)
  main.append(el('div', { style: 'text-align:center;margin-top:6px' },
    el('a', { href: '/tableau.html', class: 'small' }, '🗺 Voir le tableau complet →')));
}

async function inscrire() {
  const pseudo = document.getElementById('pseudo').value.trim();
  if (!pseudo) return;
  try { await api('/api/joueur', { method: 'POST', body: JSON.stringify({ pseudo }) }); }
  catch (e) { alert(e.message); }
}

async function inscrireCompte() {
  try {
    await api('/api/tournoi/inscrire', { method: 'POST' });
    state = await api('/api/etat');
    render();
  } catch (e) { alert(e.message); }
}

async function desinscrireCompte() {
  if (!confirm('Te désinscrire du tournoi ?')) return;
  try {
    await api('/api/tournoi/desinscrire', { method: 'DELETE' });
    state = await api('/api/etat');
    render();
  } catch (e) { alert(e.message); }
}


// ---- Fil du tournoi (accueil) : lignes dérivées de l'état à CHAQUE rendu (SSE compris) ----
// Pas de stockage : le fil raconte exactement ce que montrent les tableaux (rollback/correction
// compris, jamais de doublon ni de ligne contredite par l'état). Fragment sur les faits (victoires,
// forfaits, champion), ton « fun » uniquement pour les instants chauds (la belle).
let filOuvert = false;    // panneau étendu (« Voir tout ») ou replié (3 lignes)
let filDernier = null;    // cache du dernier tournoi terminé (fil sans tournoi actif)

// choix de variante déterministe : hachage stable de l'id, jamais de saut d'une phrase à l'autre au re-render SSE
function filHash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function filPick(id, variantes) { return variantes[filHash(id) % variantes.length]; }

// durée d'un match fini (duree_s du payload) -> « · durée 42 min » ou « · durée 1 h 05 »
function dureeFil(d) {
  if (!d) return null;
  const min = Math.max(1, Math.round(d / 60));
  if (min < 60) return `· durée ${min} min`;
  return `· durée ${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')}`;
}

function lignesFil(tv) {
  if (!tv) return [];
  const L = [];
  // champion en tête de fil : le titre du feuilleton, pas une ligne de plus dans la masse
  if (tv.champion && tv.champion.pseudo) L.push({ live: false, quand: null, parties: [filPick(String((tv.tournoi || {}).id), [
    `🏆 ${tv.champion.pseudo} remporte le tournoi !`,
    `🏆 ${tv.champion.pseudo} soulève le trophée !`,
    `🏆 ${tv.champion.pseudo} décroche le titre !`,
    `🏆 Fin du suspense : ${tv.champion.pseudo} est champion !`,
    `🏆 ${tv.champion.pseudo} a eu le dernier mot : le titre est à lui !`,
    `🏆 ${tv.champion.pseudo} entre au palmarès du club !`,
    `🏆 ${tv.champion.pseudo} règne sur le tournoi !`,
  ])] });
  // instants chauds : la belle (manche décisive en cours, les deux à une manche du match)
  const belles = new Set();
  for (const m of (tv.matchs || [])) {
    if (m.etat === 'en_cours' && m.joueur1 && m.joueur2 && m.score1 === m.manches - 1 && m.score2 === m.manches - 1) {
      belles.add(String(m.id));
      L.push({ live: true, quand: null, parties: [m.table != null
        ? filPick(String(m.id) + 'b', [
            `Suspense : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} sont à la belle à la table ${m.table}`,
            `La belle ! ${m.joueur1.pseudo} et ${m.joueur2.pseudo} à la table ${m.table}`,
            `Ça se joue à la belle entre ${m.joueur1.pseudo} et ${m.joueur2.pseudo} (table ${m.table})`,
            `Manche décisive entre ${m.joueur1.pseudo} et ${m.joueur2.pseudo} (table ${m.table}) !`,
            `Tous debout : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} disputent la belle à la table ${m.table} !`,
            `Le tournoi se joue maintenant : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} à la belle à la table ${m.table} !`,
            `Dernière manche pour ${m.joueur1.pseudo} et ${m.joueur2.pseudo} à la table ${m.table} !`,
          ])
        : filPick(String(m.id) + 'b', [
            `Suspense : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} sont à la belle`,
            `La belle entre ${m.joueur1.pseudo} et ${m.joueur2.pseudo} !`,
            `Ça se joue à la belle entre ${m.joueur1.pseudo} et ${m.joueur2.pseudo} !`,
            `Manche décisive entre ${m.joueur1.pseudo} et ${m.joueur2.pseudo} !`,
          ])] });
    }
  }
  // instants chauds : la revanche (déjà rencontrés avant, historique du club via actif.h2h)
  const h2h = tv.h2h || {};
  for (const m of (tv.matchs || [])) {
    if (m.etat !== 'en_cours' || belles.has(String(m.id)) || !m.joueur1 || !m.joueur2) continue;
    const h = h2h[m.id];
    if (!h || typeof h.n !== 'number' || h.n < 1) continue;   // jamais joué ensemble : pas de ligne
    const parties = [];
    if (h.v1 === h.v2) {
      parties.push(filPick(String(m.id) + 'e', [
        `🔥 Revanche : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} se retrouvent à égalité !`,
        `🔥 Fierté en jeu : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} se retrouvent !`,
        `🔥 ${m.joueur1.pseudo} et ${m.joueur2.pseudo} se retrouvent, bilan parfaitement équilibré !`,
        `🔥 Égalité parfaite avant ce round : ${m.joueur1.pseudo} vs ${m.joueur2.pseudo} !`,
        `🔥 Vieilles connaissances dos à dos : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} se retrouvent !`,
        `🔥 Rien à départager : ${m.joueur1.pseudo} et ${m.joueur2.pseudo} rejouent leur histoire !`,
      ]));
    } else {
      const dom = h.v1 < h.v2 ? m.joueur1 : m.joueur2;   // bilan défavorable contre lui : une revanche à prendre
      const adv = h.v1 < h.v2 ? m.joueur2 : m.joueur1;
      parties.push(filPick(String(m.id) + 'r', [
        `🔥 Revanche : ${dom.pseudo} joue contre ${adv.pseudo}, une revanche à prendre !`,
        `🔥 ${dom.pseudo} joue sa revanche contre ${adv.pseudo} !`,
        `🔥 ${dom.pseudo} retente sa chance contre ${adv.pseudo} !`,
        `🔥 ${dom.pseudo} veut renverser la vapeur contre ${adv.pseudo} !`,
        `🔥 À ${dom.pseudo} de trouver la faille face à ${adv.pseudo} !`,
        `🔥 Un compte à régler pour ${dom.pseudo} face à ${adv.pseudo} !`,
        `🔥 Ce match sent la revanche : ${dom.pseudo} défie ${adv.pseudo} !`,
      ]));
      parties.push(`${adv.pseudo} mène ${Math.max(h.v1, h.v2)}-${Math.min(h.v1, h.v2)}`);
    }
    if (m.table != null) parties.push(`· table ${m.table}`);
    L.push({ live: true, quand: null, parties });
  }
  // faits : fins de match (les byes contre blanc ne font pas de ligne), plus récents d'abord
  const res = [];
  // défaite éliminatoire définitive : uniquement en double KO (WB perdant -> repêché en LB) ;
  // en élimination directe chaque défaite élimine, la mention n'apporterait rien -> pas de mention
  const elim = (m) => tv.tournoi.format === 'double' && (m.bracket === 'LB' || m.bracket === 'F');
  for (const m of (tv.matchs || [])) {
    if ((m.etat === 'termine' || m.etat === 'forfait') && m.gagnant_id != null && m.joueur1 && m.joueur2) {
      const g = m.gagnant_id === m.joueur1.id ? m.joueur1 : m.joueur2;
      const p = m.gagnant_id === m.joueur1.id ? m.joueur2 : m.joueur1;
      const gs = m.gagnant_id === m.joueur1.id ? m.score1 : m.score2;
      const ps = m.gagnant_id === m.joueur1.id ? m.score2 : m.score1;
      const parties = [];
      const hF = h2h[m.id];   // trace persistante : paire déjà croisée avant ce match -> revanche prise ou manquée
      const revancheF = hF && typeof hF.n === 'number' && hF.n >= 1 && hF.v1 !== hF.v2
        ? ((hF.v1 < hF.v2 ? m.joueur1 : m.joueur2).id === g.id ? '· revanche prise !' : '· revanche manquée')
        : null;
      if (m.etat === 'forfait') { parties.push(filPick(String(m.id) + 'f', [
        `${p.pseudo} déclare forfait, ${g.pseudo} passe au tour suivant`,
        `${p.pseudo} abandonne, ${g.pseudo} passe au tour suivant`,
        `forfait de ${p.pseudo}, ${g.pseudo} passe au tour suivant`,
        `${p.pseudo} jette l'éponge, ${g.pseudo} passe au tour suivant`,
        `forfait de ${p.pseudo}, ${g.pseudo} avance sans jouer`,
        `${p.pseudo} ne se présente pas, ${g.pseudo} passe au tour suivant`,
        `forfait de ${p.pseudo} : ${g.pseudo} file au tour suivant`,
      ]));
        if (revancheF) parties.push(revancheF);
      }
      else {
        parties.push(filPick(String(m.id), [
          `${g.pseudo} bat ${p.pseudo} ${gs}-${ps}`,
          `${g.pseudo} s'impose face à ${p.pseudo} ${gs}-${ps}`,
          `${g.pseudo} vient à bout de ${p.pseudo} ${gs}-${ps}`,
          `${g.pseudo} domine ${p.pseudo} ${gs}-${ps}`,
          `${g.pseudo} écarte ${p.pseudo} ${gs}-${ps}`,
          `${g.pseudo} surclasse ${p.pseudo} ${gs}-${ps}`,
          `${g.pseudo} fait la loi face à ${p.pseudo} ${gs}-${ps}`,
        ]));
        if (ps === m.manches - 1) parties.push('· après la belle');   // trace persistante : la manche décisive a départagé les deux
        if (revancheF) parties.push(revancheF);
        if (m.table != null) parties.push(`· table ${m.table}`);
        const du = dureeFil(m.duree_s);
        if (du) parties.push(du);
      }
      if (elim(m)) parties.push(`· tournoi terminé pour ${p.pseudo}`);
      res.push({ live: false, quand: m.ended_at || null, parties });
    }
  }
  res.sort((a, b) => String(b.quand || '').localeCompare(String(a.quand || '')));
  return L.concat(res);
}

function filAgo(quand) {
  if (!quand) return '';
  const d = new Date(String(quand).replace(' ', 'T') + 'Z');
  const s = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
  if (s < 60) return t("à l'instant");
  const min = Math.floor(s / 60);
  if (min < 60) return t(`il y a ${min} min`);
  const h = Math.floor(min / 60);
  if (h < 24) return t(`il y a ${h} h`);
  return t(`il y a ${Math.floor(h / 24)} j`);
}

function panneauFil(tv) {
  const lignes = lignesFil(tv);
  if (!lignes.length) return null;
  const box = el('div', { class: 'panel fil' });
  box.append(el('h2', {}, 'Fil du tournoi'));
  const vis = filOuvert ? lignes : lignes.slice(0, 3);
  for (const l of vis) {
    const txt = el('span', { class: 'fil-txt' });
    txt.textContent = l.parties.map(x => t(x)).join(' ');
    box.append(el('div', { class: 'fil-ligne' + (l.live ? ' fil-live' : '') },
      txt,
      el('span', { class: 'fil-temps muted small' }, l.live ? t('en direct') : filAgo(l.quand))));
  }
  if (lignes.length > 3) {
    box.append(el('button', { class: 'secondary small fil-toggle', style: 'width:100%;margin-top:8px', onclick: () => { filOuvert = !filOuvert; render(); } }, filOuvert ? 'Replier' : 'Voir tout'));
  }
  return box;
}

// sans tournoi actif : fil du dernier tournoi terminé (payload public /api/tournois/:id)
async function chargerFilDernier() {
  const box = document.getElementById('fil-panneau');
  if (!box) return;
  const h = (state && state.historique || [])[0];
  if (!h) { box.remove(); return; }
  if (!filDernier || filDernier.tournoi.id !== h.id) {
    filDernier = null;
    try { filDernier = (await api(`/api/tournois/${h.id}`)).tournoi; } catch { filDernier = null; }
  }
  if (!document.contains(box)) return; // un autre rendu a déjà remplacé la page
  const p = filDernier && panneauFil(filDernier);
  if (p) box.replaceWith(p); else box.remove();
}


// panneau amis (si connecté): statut live des matchs des amis
async function renderAmisPanel() {
  let box = document.getElementById('amis-panel');
  const s = (typeof state !== 'undefined' && state) || null;
  if (!s || !s.compte) { if (box) box.remove(); return; }
  if (!box) {
    box = el('div', { class: 'panel', id: 'amis-panel' });
    const main = document.getElementById('main');
    const direct = [...main.children].find(c => c.querySelector && c.querySelector('h2') && c.querySelector('h2').textContent.includes('En direct'));
    if (direct) main.insertBefore(box, direct); else main.append(box); // amis juste au-dessus des matchs
  }
  let amis = [];
  try { amis = (await api('/api/compte/amis')).amis; } catch { amis = []; }
  box.innerHTML = '';
  box.append(el('h2', {}, '👥 Amis' + (amis.length ? ` (${amis.length})` : '')));
  if (!amis.length) { box.append(el('p', { class: 'muted small' }, 'Aucun ami — ajoute-en depuis le menu Compte.')); return; }
  for (const a of amis) {
    const st = a.statut || {};
    const txt = { en_cours: `🟢 en cours vs ${st.vs || '?'} (${st.score}${st.table ? ' · table ' + st.table : ''})`, pret: `🕐 programmé vs ${st.vs || '?'}`, inscrit: '📝 inscrit au tournoi', hors_tournoi: '— hors tournoi' }[st.type] || '—';
    box.append(el('div', { class: 'row', style: 'justify-content:space-between;border-top:1px solid var(--line);padding:6px 0' },
      // clic sur le nom -> fiche joueur (si l'ami est inscrit au tournoi actif)
      a.joueur_id
        ? el('a', { href: `/joueur.html?id=${a.joueur_id}`, title: `Fiche de ${a.pseudo}`, style: 'color:inherit;font-weight:700;text-decoration:none' }, a.pseudo, ' ›')
        : el('div', { style: 'font-weight:700', title: 'Jamais inscrit à un tournoi de ce club — pas de fiche' }, a.pseudo),
      el('span', { class: 'muted small' }, txt)));
  }
}

async function init() {
  state = await api('/api/etat');
  render();
  renderAmisPanel();
connecterSSE((s) => { renderAmisPanel(); state = s; render(); });
}
init();
</script>
