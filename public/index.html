<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Ball Pink City — Tournoi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
document.getElementById('nav').append(nav('home'));
const main = document.getElementById('main');
let state = null;

function render() {
  main.innerHTML = '';
  const t = state && state.actif;
  if (!t) {
    main.append(el('div', { class: 'panel', style: 'text-align:center;padding:40px 20px' },
      el('div', { class: 'hero-title' }, '🎱 Aucun tournoi pour le moment'),
      el('p', { class: 'muted' }, 'Revenez bientôt !')));
    return;
  }
  const tn = t.tournoi;

  // ---- Infos de base uniquement : nom, date, lieu ----
  main.append(el('div', { class: 'panel', style: 'text-align:center' },
    el('div', { class: 'hero-title' }, tn.nom),
    (tn.date_heure || tn.lieu) ? el('p', { style: 'font-size:clamp(18px,4.5vw,24px);font-weight:800;color:var(--gold);margin:8px 0' },
      `${tn.date_heure ? '📅 ' + fmtDateHeure(tn.date_heure) : ''}${tn.date_heure && tn.lieu ? '  ·  ' : ''}${tn.lieu ? '📍 ' + tn.lieu : ''}`) : null,
    el('div', { class: 'row', style: 'justify-content:center' },
      el('span', { class: `badge ${tn.statut}` }, tn.statut === 'inscription' ? 'Inscriptions ouvertes' : tn.statut === 'en_cours' ? '🔴 En cours' : '🏁 Terminé'),
      el('span', { class: 'chip' }, tn.regle === 'blackball' ? 'Blackball' : 'Ultimate'),
      el('span', { class: 'chip' }, `tableau ${tn.taille}`))));

  // ---- Inscription (si ouverte) ----
  if (tn.statut === 'inscription') {
    const input = el('input', { id: 'pseudo', placeholder: 'Ton pseudo', maxlength: 40, autocomplete: 'off' });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') inscrire(); });
    main.append(el('div', { class: 'panel' },
      el('div', { class: 'row' },
        el('div', {}, input),
        el('div', { style: 'flex:0 0 auto' }, el('button', { onclick: inscrire }, "S'inscrire"))),
      el('p', { class: 'muted small', style: 'margin:10px 0 0;text-align:center' }, `${t.joueurs.length}/${tn.taille} inscrits · ${t.joueurs.filter(j => j.statut === 'paye').length} payés`),
      t.joueurs.length > 0 ? el('div', { class: 'liste-joueurs', style: 'margin-top:12px' },
        t.joueurs.map(j => el('span', { class: 'chip' }, `${j.tete_de_serie ? '#' + j.tete_de_serie + ' ' : ''}${j.pseudo}${j.statut === 'paye' ? ' ✅' : ''}`))) : null));
  }

  // ---- Uniquement les matchs EN COURS ----
  const enCours = t.matchs.filter(m => m.etat === 'en_cours');
  if (enCours.length > 0) {
    main.append(el('div', { class: 'panel' },
      el('h2', {}, `🔴 En direct (${enCours.length})`),
      el('div', { class: 'matchs-grid' }, enCours.map(m => matchCard(m, { onClick: () => location.href = `/match.html?id=${m.id}` })))));
  }

  // lien discret vers le tableau complet
  main.append(el('div', { style: 'text-align:center;margin-top:6px' },
    el('a', { href: '/tableau.html', class: 'muted small' }, '🗺 Voir le tableau complet →')));
}

async function inscrire() {
  const pseudo = document.getElementById('pseudo').value.trim();
  if (!pseudo) return;
  try { await api('/api/joueur', { method: 'POST', body: JSON.stringify({ pseudo }) }); }
  catch (e) { alert(e.message); }
}

async function init() {
  state = await api('/api/etat');
  render();
  connecterSSE((s) => { state = s; render(); });
}
init();
</script>
</body>
</html>
