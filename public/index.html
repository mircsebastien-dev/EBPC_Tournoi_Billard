<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Ball Pink City — Tournoi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <nav>
    <a href="/" class="active">Tournoi</a>
    <a href="/tv.html">📺 TV</a>
    <a href="/suivi.html">Joueur</a>
    <a href="/admin.html">Table de marque</a>
  </nav>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const main = document.getElementById('main');
let state = null;

function render() {
  main.innerHTML = '';
  if (!state || !state.tournoi) {
    main.append(el('div', { class: 'panel', style: 'text-align:center;padding:40px 20px' },
      el('div', { class: 'hero-title' }, '🎱 Aucun tournoi pour le moment'),
      el('p', { class: 'muted' }, 'Revenez quand la table de marque aura lancé le prochain tournoi.')));
    return;
  }
  const t = state.tournoi;

  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, t.tournoi.nom),
    el('p', { class: 'hero-sub' },
      `${t.tournoi.regle === 'blackball' ? 'Blackball' : 'Ultimate'} · tableau ${t.tournoi.taille} · ` +
      (t.tournoi.format === 'double' ? `double KO ${t.tournoi.dko_tours} tour${t.tournoi.dko_tours > 1 ? 's' : ''}` : 'élimination directe')),
    el('div', { class: 'row' },
      el('span', { class: `badge ${t.tournoi.statut}` }, t.tournoi.statut === 'inscription' ? 'Inscriptions ouvertes' : t.tournoi.statut === 'en_cours' ? '🔴 En cours' : '🏁 Terminé')),
    t.champion ? el('p', { style: 'font-size:24px;font-weight:800;color:var(--green);margin:10px 0 0' }, `🏆 Champion : ${t.champion.pseudo}`) : null));

  if (t.tournoi.statut === 'inscription') {
    const input = el('input', { id: 'pseudo', placeholder: 'Ton pseudo', maxlength: 40, autocomplete: 'off' });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') inscrire(); });
    main.append(el('div', { class: 'panel' },
      el('h2', {}, 'Inscription'),
      el('div', { class: 'row' },
        el('div', {}, input),
        el('div', { style: 'flex:0 0 auto' }, el('button', { onclick: inscrire }, "S'inscrire"))),
      el('p', { class: 'muted small', style: 'margin:10px 0 0' }, `${t.joueurs.length}/${t.tournoi.taille} inscrits · ${t.joueurs.filter(j => j.statut === 'paye').length} payés (le tirage ne retiendra que les joueurs payés)`)));
    main.append(el('div', { class: 'panel' },
      el('h2', {}, 'Inscrits'),
      t.joueurs.length === 0
        ? el('p', { class: 'muted' }, 'Personne pour l\'instant…')
        : el('div', { class: 'liste-joueurs' }, t.joueurs.map(j => el('span', { class: 'chip' },
            `${j.tete_de_serie ? `#${j.tete_de_serie} ` : ''}${j.pseudo}`,
            el('span', { class: `badge ${j.statut === 'paye' ? 'termine' : 'pret'}` }, j.statut === 'paye' ? '✅ payé' : '⏳ en attente')))))));
  } else {
    const enCours = t.matchs.filter(m => m.etat === 'en_cours');
    if (enCours.length > 0) {
      main.append(el('div', { class: 'panel' },
        el('h2', {}, `🔴 En direct (${enCours.length})`),
        el('div', { class: 'matchs-grid' }, enCours.map(m => matchCard(m, { onClick: () => location.href = `/match.html?id=${m.id}` })))));
    }
    for (const g of grouperParRound(t.matchs, t.rounds)) {
      main.append(el('div', { class: 'round' },
        el('h3', {}, `${g.round.label} · race to ${g.round.manches}`),
        el('div', { class: 'matchs-grid' }, g.matchs.map(m => matchCard(m)))));
    }
    if (t.stats) renderStats(t.stats);
  }
}

function renderStats(stats) {
  const r = stats.resume;
  const resume = el('div', { class: 'panel' },
    el('h2', {}, '📊 Statistiques'),
    el('div', { class: 'row' },
      el('span', { class: 'chip' }, `${r.joues}/${r.total} matchs joués`),
      r.restants > 0 ? el('span', { class: 'chip' }, `${r.restants} restants`) : null,
      r.duree_moyenne_s != null ? el('span', { class: 'chip' }, `⏱ durée moyenne ${fmtDuree(r.duree_moyenne_s)}`) : null,
      r.plus_rapide ? el('span', { class: 'chip' }, `⚡ plus rapide ${fmtDuree(r.plus_rapide.d)} (${r.plus_rapide.gagnant})`) : null,
      r.plus_long ? el('span', { class: 'chip' }, `🐢 plus long ${fmtDuree(r.plus_long.d)} (${r.plus_long.gagnant})`) : null,
      r.dernier_gagnant ? el('span', { class: 'chip' }, `🔥 dernier vainqueur : ${r.dernier_gagnant}`) : null));
  main.append(resume);
  const top = stats.classement.filter(p => p.joues > 0).slice(0, 10);
  if (top.length > 0) {
    main.append(el('div', { class: 'panel' },
      el('h2', {}, '🏅 Classement'),
      el('table', { class: 'audit' },
        el('tr', {}, el('th', {}, '#'), el('th', {}, 'Joueur'), el('th', {}, 'Joués'), el('th', {}, 'Gagnés'), el('th', {}, 'Perdus'), el('th', {}, '%'), el('th', {}, 'Série')),
        ...top.map((p, i) => el('tr', {},
          el('td', {}, String(i + 1)),
          el('td', { style: 'font-weight:700' }, p.pseudo),
          el('td', {}, String(p.joues)), el('td', {}, String(p.gagnes)), el('td', {}, String(p.perdus)),
          el('td', {}, `${p.pct} %`),
          el('td', {}, p.serie > 0 ? `🔥 ${p.serie}V` : p.serie < 0 ? `${-p.serie}D` : '—'))))));
  }
}

async function inscrire() {
  const pseudo = document.getElementById('pseudo').value.trim();
  if (!pseudo) return;
  try {
    await api('/api/joueur', { method: 'POST', body: JSON.stringify({ pseudo }) });
  } catch (e) { alert(e.message); }
}

async function init() {
  state = (await api('/api/etat')).tournoi;
  render();
  connecterSSE((s) => { state = s.tournoi; render(); });
}
init();
</script>
</body>
</html>
