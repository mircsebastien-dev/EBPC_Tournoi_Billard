<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><h1>🎱 Pink City Billard</h1><div id="nav"></div></header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
document.getElementById('nav').append(nav('compte'));
const main = document.getElementById('main');
const token = new URLSearchParams(location.search).get('token') || '';
main.append(el('div', { class: 'panel', style: 'max-width:420px;margin:20px auto' },
  el('h2', {}, '🔐 Nouveau mot de passe'),
  el('div', {}, el('label', {}, 'Nouveau mot de passe (min 4)'), el('input', { id: 'pass', type: 'password', minlength: 4, autocomplete: 'new-password' })),
  el('div', { style: 'margin-top:10px' }, el('button', { style: 'width:100%', onclick: envoyer }, 'Changer le mot de passe')),
  el('p', { id: 'msg', class: 'muted small', style: 'text-align:center' })));

async function envoyer() {
  const msg = document.getElementById('msg');
  try {
    const r = await api('/api/compte/reinit', { method: 'POST', body: JSON.stringify({ token, password: document.getElementById('pass').value }) });
    msg.textContent = '✅ Mot de passe changé, tu es connecté. Redirection…';
    setTimeout(() => location.href = '/', 1200);
  } catch (e) { msg.textContent = e.message; }
}
</script>
</body>
</html>
