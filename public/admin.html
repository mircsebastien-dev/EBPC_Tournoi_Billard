<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table de marque — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Table de marque</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');

function render() {
  main.innerHTML = '';
  if (!adminPin) { renderAdminLogin(main); return; }
  const t = adminTournoiActif();
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, '🔐 Espace table de marque'),
    el('p', { class: 'muted' }, t
      ? `Tournoi en cours : « ${t.tournoi.nom} » (${t.tournoi.statut === 'inscription' ? 'inscriptions ouvertes' : 'en cours'}, ${t.joueurs.length} inscrits, ${t.matchs.filter(m => m.etat === 'termine' || m.etat === 'forfait').length}/${t.matchs.length} matchs joués)`
      : 'Aucun tournoi actif pour le moment.')));
  main.append(el('div', { class: 'panel' },
    el('h2', {}, '📌 Accès rapide'),
    el('div', { class: 'row' },
      el('a', { href: '/admin-tournoi.html' }, el('button', {}, t ? `⚙️ Gérer le tournoi « ${t.tournoi.nom} »` : '⚙️ Configurer / gérer le tournoi')),
      el('a', { href: '/admin-historique.html' }, el('button', { class: 'secondary' }, `🗂 Historique (${adminState.historique.length})`)),
      el('a', { href: '/admin-journal.html' }, el('button', { class: 'secondary' }, '📜 Journal d\'audit')),
      el('a', { href: '/admin-comptes.html' }, el('button', { class: 'secondary' }, '👤 Comptes joueurs')),
      el('a', { href: '/aide.html' }, el('button', { class: 'secondary' }, '❓ Aide')))));
  main.append(el('div', { class: 'panel' },
    el('h2', {}, '🔗 Liens publics'),
    el('div', { class: 'row' },
      el('a', { href: '/' }, el('button', { class: 'secondary' }, '🏠 Accueil')),
      el('a', { href: '/tableau.html' }, el('button', { class: 'secondary' }, '🗺 Tableau')),
      el('a', { href: '/tv.html' }, el('button', { class: 'secondary' }, '📺 TV')),
      el('a', { href: '/stats.html' }, el('button', { class: 'secondary' }, '📊 Stats')),
      el('a', { href: '/historique.html' }, el('button', { class: 'secondary' }, '🗂 Historique public')))));
  main.append(el('div', { class: 'panel' },
    el('button', { class: 'danger', onclick: () => { localStorage.removeItem('ebpc_admin_pin'); location.reload(); } }, 'Se déconnecter')));
}

async function init() {
  const ok = await adminInit(render);
  render();
}
init();
</script>
</body>
</html>
