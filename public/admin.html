<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table de marque — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>🎱 Table de marque</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script>
const main = document.getElementById('main');
let pin = localStorage.getItem('ebpc_admin_pin') || '';
document.getElementById('nav').append(nav('admin'));
let state = null;

const H = () => ({ 'Content-Type': 'application/json', ...(pin ? { 'X-Admin-Pin': pin } : {}) });
async function adminApi(path, opts = {}) {
  const res = await fetch(path, { headers: H(), ...opts });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { pin = ''; localStorage.removeItem('ebpc_admin_pin'); renderLogin(); throw new Error('PIN invalide'); }
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}
const val = (id) => document.getElementById(id).value;

function renderLogin() {
  main.innerHTML = '';
  const input = el('input', { type: 'password', id: 'pin', placeholder: 'Code PIN', inputmode: 'numeric', maxlength: 8 });
  const entrer = () => { pin = input.value.trim(); if (pin) { localStorage.setItem('ebpc_admin_pin', pin); init(); } };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') entrer(); });
  main.append(el('div', { class: 'panel', style: 'max-width:380px;margin:60px auto' },
    el('div', { class: 'hero-title', style: 'text-align:center' }, '🔐 Table de marque'),
    el('label', {}, 'Code PIN'), input,
    el('div', { style: 'margin-top:14px' }, el('button', { onclick: entrer, style: 'width:100%' }, 'Se connecter'))));
  input.focus();
}

function render() {
  if (!pin) { renderLogin(); return; }
  main.innerHTML = '';
  const t = state && state.actif;
  if (!t) renderCreerTournoi();
  else if (t.tournoi.statut === 'inscription') renderInscriptions(t);
  else renderTournoi(t);
}

function renderCreerTournoi() {
  if (state && state.historique && state.historique.length > 0) {
    main.append(el('div', { class: 'panel' },
      el('h2', {}, `🗂 Historique (${state.historique.length})`),
      ...state.historique.map(h => el('div', { class: 'match-admin', style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px' },
        el('div', {}, el('div', { style: 'font-weight:700' }, h.nom),
          el('div', { class: 'muted small' }, `${h.created_at.slice(0,10)} · ${h.nb_joueurs} joueurs${h.champion ? ` · 🏆 ${h.champion}` : ''}`)),
        el('div', { class: 'actions' },
          el('a', { href: `/tournoi.html?id=${h.id}` }, el('button', { class: 'secondary' }, '👁 Voir')),
          el('button', { class: 'danger', onclick: async () => {
            if (!confirmer(`Supprimer « ${h.nom} » de l'historique ?`)) return;
            try { await adminApi(`/api/admin/tournoi/${h.id}`, { method: 'DELETE' }); } catch (e) { alert(e.message); }
          } }, '🗑'))))));
  }
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, '🎱 Nouveau tournoi'),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Nom'), el('input', { id: 'nom', value: 'Pink City Open' })),
      el('div', {}, el('label', {}, 'Règle'), el('select', { id: 'regle' }, el('option', { value: 'blackball' }, 'Blackball'), el('option', { value: 'ultimate' }, 'Ultimate'))),
      el('div', {}, el('label', {}, 'Taille max'), el('select', { id: 'taille' }, [16, 32, 64, 128].map(n => el('option', { value: n, ...(n === 32 ? { selected: '' } : {}) }, `${n} joueurs`))))),
    el('div', { class: 'row' },
      el('div', {}, el('label', { style: 'display:flex;gap:8px;align-items:center' }, el('input', { id: 'auto', type: 'checkbox', style: 'width:auto', checked: '' }), 'Ajuster automatiquement la taille au nombre de payés'))),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Distance spéciale à partir de'), el('select', { id: 'seuil' },
        el('option', { value: 'jamais' }, 'Jamais (3 partout)'),
        el('option', { value: 'quarts' }, 'Quarts de finale'),
        el('option', { value: 'demis' }, 'Demi-finales'),
        el('option', { value: 'finale' }, 'Finale seule'))),
      el('div', { style: 'flex:0 0 130px' }, el('label', {}, 'Distance spéciale'), el('select', { id: 'distspe' }, [3, 5, 7].map(n => el('option', { value: n }, `${n} manches`))))),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Format'), el('select', { id: 'format' }, el('option', { value: 'simple' }, 'Élimination directe'), el('option', { value: 'double', selected: '' }, 'Double KO + tableau final'))),
      el('div', {}, el('label', {}, 'Double KO sur'), el('select', { id: 'dko' }, [1, 2, 3].map(n => el('option', { value: n, ...(n === 2 ? { selected: '' } : {}) }, `${n} tour${n > 1 ? 's' : ''}`))))),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Tables'), el('input', { id: 'nbtables', type: 'number', value: 4, min: 1, max: 20 })),
      el('div', {}, el('label', { style: 'display:flex;gap:8px;align-items:center' }, el('input', { id: 'tds', type: 'checkbox', style: 'width:auto' }), 'Têtes de série'))),
    el('div', { style: 'margin-top:16px' }, el('button', { onclick: creer, style: 'width:100%' }, 'Créer le tournoi'))));
  async function creer() {
    try {
      await adminApi('/api/admin/tournoi', { method: 'POST', body: JSON.stringify({
        nom: val('nom'), regle: val('regle'), taille: Number(val('taille')),
        format: val('format'), dko_tours: Number(val('dko')),
        tetes_de_serie: document.getElementById('tds').checked, nb_tables: Number(val('nbtables')),
        ajustement_auto: document.getElementById('auto').checked,
        seuil_distance: val('seuil'), distance_speciale: Number(val('distspe')),
      })});
    } catch (e) { alert(e.message); }
  }
}

function renderInscriptions(t) {
  const tn = t.tournoi;
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, tn.nom),
    el('p', { class: 'hero-sub' }, `${tn.ajustement_auto ? `jusqu'à ${tn.taille}` : tn.taille} joueurs · ${t.joueurs.length} inscrits · ${t.joueurs.filter(j => j.statut === 'paye').length} payés · ${t.tables.length} tables${tn.ajustement_auto ? ' · taille ajustée automatiquement au tirage' : ''}`),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Pseudo'), el('input', { id: 'pseudo', maxlength: 40, placeholder: 'Nouveau joueur', autocomplete: 'off' })),
      tn.tetes_de_serie ? el('div', { style: 'flex:0 0 90px' }, el('label', {}, 'N° série'), el('input', { id: 'tds', type: 'number', min: 1 })) : null,
      el('div', { style: 'flex:0 0 auto' }, el('button', { onclick: ajouter }, 'Inscrire'))),
    el('div', { class: 'panel', style: 'margin-top:12px;border-style:dashed' },
      el('h2', {}, '🎲 Mode simulation'),
      el('p', { class: 'muted small' }, 'Inscrit des joueurs fictifs en masse, directement marqués payés (pour tester le tableau rapidement).'),
      el('div', { class: 'row' },
        el('div', { style: 'flex:0 0 110px' }, el('label', {}, 'Nombre'), el('input', { id: 'simcount', type: 'number', value: 16, min: 1, max: 128 })),
        el('div', { style: 'flex:0 0 110px' }, el('label', {}, 'Préfixe'), el('input', { id: 'simprefix', value: 'Simu', maxlength: 12 })),
        el('div', { style: 'flex:0 0 auto' }, el('button', { class: 'secondary', onclick: simuler }, 'Ajouter'))))));
  async function simuler() {
    const count = Number(val('simcount')) || 8;
    const prefix = val('simprefix') || 'Simu';
    try {
      const r = await adminApi('/api/admin/joueurs/simulation', { method: 'POST', body: JSON.stringify({ count, prefix }) });
      alert(`${r.crees} joueur(s) fictif(s) ajouté(s) et marqués payés ✅`);
    } catch (e) { alert(e.message); }
  }
  async function ajouter() {
    const pseudo = val('pseudo').trim();
    if (!pseudo) return;
    const body = { pseudo };
    const tds = document.getElementById('tds');
    if (tds && tds.value) body.tete_de_serie = Number(tds.value);
    try { await adminApi('/api/admin/joueur', { method: 'POST', body: JSON.stringify(body) }); }
    catch (e) { alert(e.message); }
  }

  main.append(el('div', { class: 'panel' },
    el('h2', {}, 'Inscrits'),
    el('div', { class: 'liste-joueurs' },
      t.joueurs.map(j => el('span', { class: 'chip' }, `${j.tete_de_serie ? `#${j.tete_de_serie} ` : ''}${j.pseudo}`,
        j.statut === 'paye'
          ? el('button', { class: 'secondary', onclick: () => paiement(j, 'en_attente') }, '✅ payé → annuler')
          : el('button', { onclick: () => paiement(j, 'paye') }, '💰 marquer payé'),
        el('button', { class: 'danger', onclick: async () => { if (confirmer(`Retirer ${j.pseudo} ?`)) { try { await adminApi(`/api/admin/joueur/${j.id}`, { method: 'DELETE' }); } catch (e) { alert(e.message); } } } }, '✕'))))));
  async function paiement(j, statut) {
    try { await adminApi(`/api/admin/joueur/${j.id}/paiement`, { method: 'POST', body: JSON.stringify({ statut }) }); }
    catch (e) { alert(e.message); }
  }

  main.append(el('div', { class: 'panel' },
    el('h2', {}, 'Distances (manches gagnantes)'),
    el('div', { class: 'row' }, t.rounds.map(r =>
      el('div', { style: 'flex:1 1 120px' }, el('label', {}, r.label), el('select', { id: `dist-${r.key}`, 'data-round': r.key },
        [3, 5, 7].map(n => el('option', { value: n, ...(n === r.manches ? { selected: '' } : {}) }, `${n} manches`)))))),
    el('div', { style: 'margin-top:12px' }, el('button', { class: 'secondary', onclick: sauverDistances }, 'Enregistrer'))));

  async function sauverDistances() {
    const distances = {};
    document.querySelectorAll('select[data-round]').forEach(s => { distances[s.dataset.round] = Number(s.value); });
    try { await adminApi('/api/admin/distances', { method: 'PUT', body: JSON.stringify({ distances }) }); }
    catch (e) { alert(e.message); }
  }

  main.append(el('div', { class: 'panel' },
    el('button', { onclick: tirage, disabled: t.joueurs.filter(j => j.statut === 'paye').length < 2 ? '' : null, style: 'width:100%' }, `🎲 Lancer le tirage (${t.joueurs.filter(j => j.statut === 'paye').length} joueurs payés)`),
    el('p', { class: 'muted small' }, 'Les distances ci-dessus peuvent être changées à tout moment, même en cours de tournoi (elles s\'appliquent aux matchs non joués).'),
    el('div', { style: 'margin-top:12px' }, el('button', { class: 'danger', style: 'width:100%', onclick: supprimer }, 'Supprimer le tournoi'))));

  async function tirage() {
    if (!confirmer('Lancer le tirage ? Les inscriptions seront closes.')) return;
    try { await adminApi('/api/admin/tirage', { method: 'POST', body: '{}' }); }
    catch (e) { alert(e.message); }
  }
  async function supprimer() {
    if (!confirmer('Supprimer le tournoi et TOUT son contenu ?')) return;
    try { await adminApi('/api/admin/tournoi', { method: 'DELETE' }); }
    catch (e) { alert(e.message); }
  }
}

function renderTournoi(t) {
  const tn = t.tournoi;
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, tn.nom),
    el('p', { class: 'hero-sub' }, `${tn.regle === 'blackball' ? 'Blackball' : 'Ultimate'} · ${tn.taille} joueurs · ${tn.format === 'double' ? `DKO ${tn.dko_tours} tours` : 'élimination directe'} · ${t.tables.length} tables`),
    el('div', { class: 'row' },
      el('span', { class: 'chip' }, `${t.joueurs.length} joueurs`),
      el('span', { class: 'chip' }, `${t.matchs.filter(m => m.etat === 'termine' || m.etat === 'forfait').length}/${t.matchs.length} matchs joués`)),
    t.champion ? el('p', { style: 'font-size:24px;font-weight:800;color:var(--gold)' }, `🏆 Champion : ${t.champion.pseudo}`) : null));

  main.append(el('div', { class: 'panel' },
    el('h2', {}, '📏 Distances (modifiables à tout moment)'),
    el('p', { class: 'muted small' }, 'S\'appliquent aux matchs non encore joués.'),
    el('div', { class: 'row' }, t.rounds.map(r =>
      el('div', { style: 'flex:1 1 120px' }, el('label', {}, r.label), el('select', { id: `dist-${r.key}`, 'data-round': r.key },
        [3, 5, 7].map(n => el('option', { value: n, ...(n === r.manches ? { selected: '' } : {}) }, `${n} manches`)))))),
    el('div', { style: 'margin-top:12px' }, el('button', { class: 'secondary', onclick: sauverDistances2 }, 'Enregistrer'))));

  async function sauverDistances2() {
    const distances = {};
    document.querySelectorAll('select[data-round]').forEach(s => { distances[s.dataset.round] = Number(s.value); });
    try { await adminApi('/api/admin/distances', { method: 'PUT', body: JSON.stringify({ distances }) }); }
    catch (e) { alert(e.message); }
  }

  const prets = t.matchs.filter(m => m.etat === 'pret');
  const enCours = t.matchs.filter(m => m.etat === 'en_cours');

  if (prets.length > 0) {
    const p = el('div', { class: 'panel' }, el('h2', {}, `⏳ Prêts à lancer (${prets.length})`));
    for (const m of prets) {
      const occupees = new Set(t.matchs.filter(mm => mm.etat === 'en_cours' && mm.table != null).map(mm => mm.table));
      const sel = el('select', { id: `table-${m.id}`, style: 'width:auto' },
        el('option', { value: '' }, '🎱 Table auto (libre)'),
        t.tables.map(tb => el('option', { value: tb.id, ...(occupees.has(tb.numero) ? { disabled: '' } : {}) }, `Table ${tb.numero}${occupees.has(tb.numero) ? ' (occupée)' : ''}`)));
      p.append(el('div', { class: 'match-admin' },
        el('div', { style: 'font-weight:700;font-size:16px' }, `${m.joueur1 ? m.joueur1.pseudo : '—'}  vs  ${m.joueur2 ? m.joueur2.pseudo : '—'}`),
        el('div', { class: 'muted small' }, `${m.bracket === 'WB' ? 'Tour' : m.bracket === 'LB' ? 'Loser bracket' : 'Tableau final'} ${m.tour} · race to ${m.manches}`),
        el('div', { class: 'actions' }, sel, el('button', { onclick: () => lancer(m.id, sel.value ? Number(sel.value) : null) }, '▶ Lancer'))));
    }
    main.append(p);
  }

  if (enCours.length > 0) {
    const p = el('div', { class: 'panel' }, el('h2', {}, `🔴 En cours (${enCours.length})`));
    for (const m of enCours) {
      p.append(el('div', { class: 'match-admin' },
        matchCard(m),
        el('div', { class: 'actions' },
          el('button', { class: 'secondary', onclick: () => corriger(m) }, '✏️ Corriger'),
          el('button', { class: 'danger', onclick: () => forfait(m, m.joueur1.id) }, `${m.joueur1 ? m.joueur1.pseudo : ''} forfait`),
          el('button', { class: 'danger', onclick: () => forfait(m, m.joueur2.id) }, `${m.joueur2 ? m.joueur2.pseudo : ''} forfait`))));
    }
    main.append(p);
  }

  for (const g of grouperParRound(t.matchs, t.rounds)) {
    main.append(el('div', { class: 'round' },
      el('h3', {}, `${g.round.label} · race to ${g.round.manches}`),
      el('div', { class: 'matchs-grid' }, g.matchs.map(m =>
        el('div', {}, matchCard(m),
          (m.etat === 'termine' || m.etat === 'forfait') ? el('div', { style: 'margin-top:8px' }, el('button', { class: 'secondary', onclick: () => corriger(m) }, '✏️ Corriger')) : null)))));
  }

  main.append(el('div', { class: 'panel' },
    el('h2', {}, '🎬 Simulation'),
    el('p', { class: 'muted small' }, 'Joue automatiquement tous les matchs restants avec des scores aléatoires, jusqu\'au champion.'),
    el('button', { class: 'secondary', style: 'width:100%', onclick: simulerTout }, '▶ Simuler tout le tournoi')));

  async function simulerTout() {
    if (!confirmer('Lancer la simulation complète ? Tous les matchs restants seront joués automatiquement (scores aléatoires).')) return;
    try {
      const r = await adminApi('/api/admin/simuler', { method: 'POST', body: '{}' });
      alert(`Simulation terminée : ${r.matchs_joues} matchs joués. ${r.statut === 'termine' ? '🏆 Champion : ' + r.champion : 'Tournoi non terminé (' + r.statut + ')'}`);
    } catch (e) { alert(e.message); }
  }

  main.append(el('div', { class: 'panel' },
    el('h2', {}, '⚠️ Clôturer le tournoi'),
    el('p', { class: 'muted small' }, 'Termine le tournoi immédiatement, même si la finale n\'a pas été jouée. Les tableaux restent en ligne jusqu\'au prochain tournoi.'),
    el('div', { class: 'row' },
      el('div', {}, el('label', {}, 'Champion (optionnel)'), el('select', { id: 'champion' }, el('option', { value: '' }, 'Dernier gagnant (auto)'), t.joueurs.map(j => el('option', { value: j.id, ...(t.champion && t.champion.id === j.id ? { selected: '' } : {}) }, j.pseudo)))),
      el('div', { style: 'flex:0 0 auto' }, el('button', { class: 'danger', onclick: terminer }, '🏁 Terminer le tournoi maintenant')))));

  async function terminer() {
    if (!confirmer('Terminer le tournoi maintenant ? Les matchs non joués seront clôturés.')) return;
    const cid = val('champion');
    try { await adminApi('/api/admin/terminer', { method: 'POST', body: JSON.stringify({ champion_id: cid ? Number(cid) : null }) }); }
    catch (e) { alert(e.message); }
  }

  main.append(el('div', { class: 'panel' }, el('h2', {}, '📜 Journal'), el('div', { id: 'audit' })));
  chargerAudit();

  async function lancer(id, tableId) {
    try { await adminApi(`/api/admin/match/${id}/lancer`, { method: 'POST', body: JSON.stringify({ table_id: tableId }) }); }
    catch (e) { alert(e.message); }
  }
  async function forfait(m, joueurId) {
    const qui = joueurId === m.joueur1.id ? m.joueur1.pseudo : m.joueur2.pseudo;
    if (!confirmer(`Forfait de ${qui} ?`)) return;
    try { await adminApi(`/api/admin/match/${m.id}/forfait`, { method: 'POST', body: JSON.stringify({ joueur_id: joueurId }) }); }
    catch (e) { alert(e.message); }
  }
  function corriger(m) {
    const s1 = prompt(`Score de ${m.joueur1 ? m.joueur1.pseudo : 'J1'} (0-${m.manches}) :`, String(m.score1));
    if (s1 == null) return;
    const s2 = prompt(`Score de ${m.joueur2 ? m.joueur2.pseudo : 'J2'} (0-${m.manches}) :`, String(m.score2));
    if (s2 == null) return;
    const man = prompt('Distance (3/5/7) :', String(m.manches));
    if (man == null) return;
    const motif = prompt('Motif :', 'correction table de marque');
    adminApi(`/api/admin/match/${m.id}/correction`, { method: 'POST', body: JSON.stringify({ score1: Number(s1), score2: Number(s2), manches: Number(man), motif: motif || '' }) })
      .catch(e => alert(e.message));
  }
}

async function chargerAudit() {
  try {
    const { audit } = await adminApi('/api/admin/audit');
    const box = document.getElementById('audit');
    if (!box) return;
    box.innerHTML = '';
    box.append(el('table', { class: 'audit' },
      el('tr', {}, el('th', {}, 'Date'), el('th', {}, 'Action'), el('th', {}, 'Cible'), el('th', {}, 'Détails')),
      ...audit.slice(0, 100).map(a => el('tr', {},
        el('td', {}, a.created_at), el('td', {}, a.action), el('td', {}, a.cible || ''),
        el('td', { class: 'small muted' }, `${a.avant || ''} → ${a.apres || ''}`)))));
  } catch {}
}

async function init() {
  try {
    state = await api('/api/etat');
    render();
    connecterSSE((s) => { state = s; render(); });
  } catch { if (!pin) renderLogin(); }
}
init();
</script>
</body>
</html>
