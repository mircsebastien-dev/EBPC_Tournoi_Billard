<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table de marque — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Table de marque</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');
let superAdminMenu = false; // menu Console réservé au super-admin (code global ou compte super-admin/admin global)
// 17l: le panneau Apparence du club a déménagé dans sa page dédiée /admin-apparence.html (l accueil admin reste épuré)

function render() {
  main.innerHTML = '';
  if (!adminPin && !adminCompte) { renderAdminLogin(main); return; }
  const tn = adminTournoiActif(); // tn (pas t !): une variable locale t masquerait la fonction de traduction t()
      // et ferait planter render() sur le premier appel t('...') -> panneaux suivants jamais affichés
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, 'Espace table de marque'),
    el('p', { class: 'muted' }, tn
      ? `Tournoi en cours : « ${tn.tournoi.nom} » (${tn.tournoi.statut === 'inscription' ? 'inscriptions ouvertes' : 'en cours'}, ${tn.joueurs.length} inscrits, ${tn.matchs.filter(m => m.etat === 'termine' || m.etat === 'forfait').length}/${tn.matchs.length} matchs joués)`
      : 'Aucun tournoi actif pour le moment.')));
  if (adminState && adminState.club && adminState.club.demo) { // 84. bannière bac à sable + reset
    main.append(el('div', { class: 'panel', style: 'border-color:var(--gold)' },
      el('h2', {}, '🧪 Mode démo — données jetables'),
      el('p', { class: 'muted small' }, 'Ce club est un bac à sable : tout ce qui y est créé peut être effacé d\'un coup (tournois, matchs, actus, journal). Les comptes restent.'),
      el('button', { class: 'danger', onclick: async () => {
        try {
          await adminApiDestructif('/api/admin/club/demo/reset', { method: 'POST', body: JSON.stringify({}) }, 'réinitialiser TOUTES les données de ce club démo');
          location.reload();
        } catch (e) { alert(e.message); }
      } }, '🗑️ Réinitialiser la démo')));
  }
  main.append(el('div', { class: 'panel' },
    el('h2', {}, '📌 Accès rapide'),
    el('div', { class: 'row' },
      el('a', { href: '/admin-tournoi.html' }, el('button', {}, tn ? `Gérer le tournoi « ${tn.tournoi.nom} »` : 'Configurer / gérer le tournoi')),
      el('a', { href: '/admin-historique.html' }, el('button', { class: 'secondary' }, ['Historique', ` (${adminState.historique.length})`])),
      el('a', { href: '/admin-journal.html' }, el('button', { class: 'secondary' }, 'Journal d\'audit')),
      el('a', { href: '/admin-comptes.html' }, el('button', { class: 'secondary' }, 'Comptes joueurs')),
      ...(superAdminMenu ? [el('a', { href: '/console.html' }, el('button', { class: 'secondary' }, '🛡️ Console'))] : []),
      el('a', { href: '/admin-aide.html' }, el('button', { class: 'secondary' }, 'Guide admin')),
      el('a', { href: '/admin-data.html' }, el('button', { class: 'secondary' }, 'Données')),
      el('a', { href: '/admin-apparence.html' }, el('button', { class: 'secondary' }, t('🎨 Apparence du club'))),
      el('a', { href: '/admin-actu.html' }, el('button', { class: 'secondary' }, '📰 News du club')))));

  main.append(el('div', { class: 'panel' },
    el('h2', {}, '🔗 Liens publics'),
    el('div', { class: 'row' },
      el('a', { href: '/' }, el('button', { class: 'secondary' }, 'Accueil')),
      el('a', { href: '/tableau.html' }, el('button', { class: 'secondary' }, 'Tableau')),
      el('a', { href: '/tv.html' }, el('button', { class: 'secondary' }, 'TV')),
      el('a', { href: '/stats.html' }, el('button', { class: 'secondary' }, 'Stats')),
      el('a', { href: '/historique.html' }, el('button', { class: 'secondary' }, 'Historique public')))));
  main.append(el('div', { class: 'panel' },
    el('button', { class: 'danger', onclick: () => { localStorage.removeItem('ebpc_admin_pin'); location.reload(); } }, 'Se déconnecter')));
}

async function init() {
  const ok = await adminInit(render);
  // super-admin ? (le serveur seul sait si le code saisi est le code global ou celui d'un club)
  if (ok) { try { superAdminMenu = (await adminApi('/api/admin/super')).super_admin === true; } catch (e) { superAdminMenu = false; } }
  render();
}
init();
</script>
</body>
</html>
