<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table de marque — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<script>try{if(localStorage.getItem('ebpc_theme')==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="top">
  <h1>🎱 Table de marque</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('admin'));
const main = document.getElementById('main');
let superAdminMenu = false; // menu Console réservé au super-admin (code global ou compte super-admin/admin global)
const JOURS_PREFS = [[0, 'Dimanche'], [1, 'Lundi'], [2, 'Mardi'], [3, 'Mercredi'], [4, 'Jeudi'], [5, 'Vendredi'], [6, 'Samedi']]; // convention JS: 0 = dimanche

// 17j. Personnalisation du club : couleur d accent + défauts de tournoi (nom, jour récurrent, heure)
// geste NON sensible: PIN du club déjà requis pour l espace admin, aucun confirm_pin supplémentaire
async function chargerPrefsApparence() {
  try {
    const rep = await adminApi('/api/admin/club/prefs');
    const p = rep && rep.prefs ? rep.prefs : {};
    document.getElementById('pref-accent').value = p.accent || '#d6336c';
    document.getElementById('pref-nom').value = p.defaut_nom || '';
    document.getElementById('pref-jour').value = p.defaut_jour == null ? '' : String(p.defaut_jour);
    document.getElementById('pref-heure').value = p.defaut_heure || '20:00';
  } catch (e) {}
}
async function enregPrefsApparence() {
  try {
    const rep = await adminApi('/api/admin/club/prefs', { method: 'PUT', body: JSON.stringify({
      accent: document.getElementById('pref-accent').value,
      defaut_nom: document.getElementById('pref-nom').value.trim(),
      defaut_jour: document.getElementById('pref-jour').value === '' ? null : Number(document.getElementById('pref-jour').value),
      defaut_heure: document.getElementById('pref-heure').value || '20:00',
    })});
    if (rep && rep.prefs && typeof appliquerAccentClub === 'function') appliquerAccentClub(rep.prefs.accent); // aperçu immédiat
    alert(t('Personnalisation enregistrée'));
  } catch (e) { alert(e.message); }
}

function render() {
  main.innerHTML = '';
  if (!adminPin && !adminCompte) { renderAdminLogin(main); return; }
  const t = adminTournoiActif();
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, 'Espace table de marque'),
    el('p', { class: 'muted' }, t
      ? `Tournoi en cours : « ${t.tournoi.nom} » (${t.tournoi.statut === 'inscription' ? 'inscriptions ouvertes' : 'en cours'}, ${t.joueurs.length} inscrits, ${t.matchs.filter(m => m.etat === 'termine' || m.etat === 'forfait').length}/${t.matchs.length} matchs joués)`
      : 'Aucun tournoi actif pour le moment.')));
  main.append(el('div', { class: 'panel' },
    el('h2', {}, '📌 Accès rapide'),
    el('div', { class: 'row' },
      el('a', { href: '/admin-tournoi.html' }, el('button', {}, t ? `Gérer le tournoi « ${t.tournoi.nom} »` : 'Configurer / gérer le tournoi')),
      el('a', { href: '/admin-historique.html' }, el('button', { class: 'secondary' }, ['Historique', ` (${adminState.historique.length})`])),
      el('a', { href: '/admin-journal.html' }, el('button', { class: 'secondary' }, 'Journal d\'audit')),
      el('a', { href: '/admin-comptes.html' }, el('button', { class: 'secondary' }, 'Comptes joueurs')),
      ...(superAdminMenu ? [el('a', { href: '/console.html' }, el('button', { class: 'secondary' }, '🛡️ Console'))] : []),
      el('a', { href: '/admin-aide.html' }, el('button', { class: 'secondary' }, 'Guide admin')),
      el('a', { href: '/admin-data.html' }, el('button', { class: 'secondary' }, 'Données')))));
  main.append(el('div', { class: 'panel' },
    el('h2', {}, '🔗 Liens publics'),
    el('div', { class: 'row' },
      el('a', { href: '/' }, el('button', { class: 'secondary' }, 'Accueil')),
      el('a', { href: '/tableau.html' }, el('button', { class: 'secondary' }, 'Tableau')),
      el('a', { href: '/tv.html' }, el('button', { class: 'secondary' }, 'TV')),
      el('a', { href: '/stats.html' }, el('button', { class: 'secondary' }, 'Stats')),
      el('a', { href: '/historique.html' }, el('button', { class: 'secondary' }, 'Historique public')))));
  main.append(el('div', { class: 'panel' },
    el('h2', {}, t('🎨 Apparence du club')),
    el('p', { class: 'muted' }, t('Visible par tous les visiteurs du club.')),
    el('div', { class: 'row', style: 'flex-wrap:wrap;gap:8px' },
      el('div', {}, el('label', {}, t('Couleur d accent')), el('input', { id: 'pref-accent', type: 'color', value: '#d6336c', style: 'width:74px;height:38px;padding:2px' })),
      el('div', {}, el('label', {}, t('Nom par défaut des tournois')), el('input', { id: 'pref-nom', maxlength: 80, placeholder: 'ex : Open du Mercredi', style: 'width:220px' })),
      el('div', {}, el('label', {}, t('Jour récurrent')), el('select', { id: 'pref-jour' },
        el('option', { value: '' }, t('Aucun')),
        ...JOURS_PREFS.map(([v, l]) => el('option', { value: v }, t(l))))),
      el('div', {}, el('label', {}, t('Heure habituelle')), el('input', { id: 'pref-heure', type: 'time', value: '20:00' }))),
    el('div', { class: 'row', style: 'margin-top:12px' }, el('button', { onclick: enregPrefsApparence }, t('Enregistrer')))));
  chargerPrefsApparence();
  main.append(el('div', { class: 'panel' },
    el('button', { class: 'danger', onclick: () => { localStorage.removeItem('ebpc_admin_pin'); location.reload(); } }, 'Se déconnecter')));
}

async function init() {
  const ok = await adminInit(render);
  // super-admin ? (le serveur seul sait si le code saisi est le code global ou celui d'un club)
  if (ok) { try { superAdminMenu = (await adminApi('/api/admin/super')).super_admin === true; } catch (e) { superAdminMenu = false; } }
  render();
}
init();
</script>
</body>
</html>
