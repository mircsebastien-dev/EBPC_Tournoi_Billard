<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau — Pink City Billard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
.bracket-scroll { overflow-x: auto; padding-bottom: 10px; }
.bracket { display: flex; gap: 18px; align-items: stretch; min-width: max-content; position: relative; }
.bracket-col { display: block; min-width: 168px; position: relative; z-index: 1; }
.bracket-col.lb, .bracket-col.finale { min-width: 150px; }
.bracket-col h3 { position: sticky; top: 0; }
.bracket-col h3 { text-align: center; margin-bottom: 8px; }
.bracket-col.lb h3 { color: #ff8fb8; }
.bracket-col.wb h3 { color: var(--pink-soft); }
.bracket-col.finale h3 { color: var(--gold); }
.node { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; margin: 0; font-size: 12.5px; min-width: 150px; height: 84px; overflow: hidden; box-sizing: border-box; }
.node .nj span:first-child { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
.node .meta { display: flex; flex-wrap: wrap; gap: 3px; font-size: 10px; margin-top: 3px; }
.node.live { border-color: var(--pink); box-shadow: 0 0 14px var(--pink-glow); }
.node.done { opacity: 0.75; }
.node.attente { border-style: dashed; opacity: 0.85; background: repeating-linear-gradient(45deg, var(--panel), var(--panel) 8px, var(--bg2) 8px, var(--bg2) 16px); }
.node .nj { display: flex; justify-content: space-between; gap: 8px; }
.node .nj.win { color: var(--green); font-weight: 700; }
.node .nj .sc { color: var(--pink-soft); font-weight: 700; }
.node .nj.attente-j { color: var(--muted); font-style: italic; }
.node .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.attente-tag { color: var(--gold); font-weight: 700; }
#bracket-svg { position: absolute; top: 0; left: 0; z-index: 3; pointer-events: none; overflow: visible; }
#bracket-svg path { stroke: rgba(255, 122, 181, 0.85); stroke-width: 3; fill: none; }
#bracket-svg path.halo { stroke: rgba(255, 46, 136, 0.18); stroke-width: 9; }
#bracket-svg path.live { stroke: var(--pink); stroke-width: 4; }
#bracket-svg path.live.halo { stroke: rgba(255, 46, 136, 0.35); stroke-width: 11; }
#bracket-svg path.done { stroke: rgba(46, 230, 168, 0.9); stroke-width: 3; }
#bracket-svg path.done.halo { stroke: rgba(46, 230, 168, 0.2); stroke-width: 9; }
#bracket-svg path.attente { stroke: rgba(255, 209, 102, 0.75); stroke-width: 2.5; stroke-dasharray: 6 6; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
</style>
</head>
<body>
<header class="top">
  <h1>🎱 Pink City Billard</h1>
  <div id="nav"></div>
</header>
<main id="main"></main>
<script src="/common.js"></script>
<script src="/admin-common.js"></script>
<script>
document.getElementById('nav').append(nav('tableau'));
const main = document.getElementById('main');
let state = null;
// défaut: bracket sur desktop, LISTE sur téléphone (le bracket est illisible en petit écran)
let viewMode = (new URLSearchParams(location.search)).get('vue') || localStorage.getItem('ebpc_view') || 'bracket';
let filtreJoueur = '';
let autoScrolled = false;

// Au chargement, centre la vue bracket sur la colonne "Tour 1" (WB tour 1)
function scrollToRound1() {
  if (autoScrolled || viewMode !== 'bracket') return;
  const wrap = main.querySelector('.bracket-scroll');
  const bracket = document.getElementById('bracket');
  if (!wrap || !bracket) return;
  const col = [...bracket.querySelectorAll('.bracket-col.wb')]
    .find(c => /Tour 1\b/.test(c.querySelector('h3')?.textContent || ''));
  if (!col) return;
  const target = col.offsetLeft - (wrap.clientWidth - col.offsetWidth) / 2;
  wrap.scrollLeft = Math.max(0, target);
  autoScrolled = true;
}

function feederLabel(t, src, kind) {
  const r = t.rounds.find(rr => rr.bracket === src.bracket && rr.tour === src.tour);
  const nom = r ? r.label : src.bracket + ' t' + src.tour;
  return `${kind === 'perdant' ? 'perdant' : 'vainqueur'} du match #${src.position} (${nom})`;
}

function render() {
  main.innerHTML = '';
  const t = state && state.actif;
  if (!t) {
    main.append(el('div', { class: 'panel', style: 'text-align:center;padding:40px 20px' },
      el('div', { class: 'hero-title' }, '🎱 Aucun tournoi en cours'),
      el('p', { class: 'muted' }, 'Le tableau apparaîtra ici dès le tirage au sort.')));
    return;
  }
  main.append(el('div', { class: 'panel' },
    el('div', { class: 'hero-title' }, `🗺 Tableau — ${t.tournoi.nom}`),
    el('p', { class: 'hero-sub' }, `${t.tournoi.regle === 'blackball' ? 'Blackball' : 'Ultimate'} · ${t.tournoi.taille} joueurs · ${t.tournoi.format === 'double' ? 'double KO ' + t.tournoi.dko_tours + ' tours + tableau final' : 'élimination directe'}`),
    el('div', { class: 'round-nav' },
      el('label', { class: 'muted small', style: 'align-self:center' }, 'Aller au tour :'),
      (() => {
        const sel = el('select', {
          class: 'round-select',
          onchange: (e) => {
            const id = e.target.value;
            const c = document.getElementById(id);
            if (c) c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'start' });
            e.target.value = '';
          },
        },
          el('option', { value: '' }, '— Choisir un tour —'),
          ...t.rounds.map(r => el('option', { value: 'col-' + r.bracket + r.tour }, `${r.label} · race to ${r.manches}`)));
        return sel;
      })()),
    el('div', { class: 'view-switch' },
      el('button', { class: viewMode === 'bracket' ? '' : 'secondary', onclick: () => switchView('bracket') }, '🗺 Bracket'),
      el('button', { class: viewMode === 'liste' ? '' : 'secondary', onclick: () => switchView('liste') }, '📋 Liste'))));
  if (viewMode === 'bracket') {
    renderBracket(main, t);
    requestAnimationFrame(scrollToRound1);
    setTimeout(scrollToRound1, 150);
    setTimeout(scrollToRound1, 600);
  } else renderListe(main, t);
  // légende en bas de page
  main.append(el('div', { class: 'legend legend-bottom' },
    el('span', { class: 'chip' }, '⬅ Loser bracket en miroir (tour 1 collé au WB, lecture droite→gauche)'),
    el('span', { class: 'chip' }, 'Tours 1, 2… (WB) au centre'),
    el('span', { class: 'chip' }, '🏁 Tableau final à droite'),
    el('span', { class: 'chip' }, 'Rose = en cours'),
    el('span', { class: 'chip' }, 'Vert = joué'),
    el('span', { class: 'chip' }, '⏳ pointillé = match attendu')));
}

function switchView(mode) {
  viewMode = mode;
  localStorage.setItem('ebpc_view', mode);
  render();
}

function renderListe(container, t) {
  const rounds = t.rounds;
  // barre de filtre par joueur (préfixe, insensible à la casse)
  const input = el('input', {
    id: 'filtre-joueur', placeholder: '🔍 Filtrer par joueur (ex: seb) — Entrée pour valider', value: filtreJoueur, maxlength: 24,
    style: 'width:100%;max-width:340px',
  });
  // validation par Entrée seulement (sinon le re-render fait perdre le focus)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      filtreJoueur = input.value.trim().toLowerCase();
      render();
      const f = document.getElementById('filtre-joueur'); // garder le focus après le re-render
      if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
    }
  });
  container.append(el('div', { class: 'panel', style: 'padding:10px 14px;margin-bottom:12px' }, input));
  const matchJoueur = (m) => !filtreJoueur
    || (m.joueur1 && m.joueur1.pseudo.toLowerCase().startsWith(filtreJoueur))
    || (m.joueur2 && m.joueur2.pseudo.toLowerCase().startsWith(filtreJoueur));
  const byKey = {};
  for (const m of t.matchs) (byKey[m.bracket + m.tour] = byKey[m.bracket + m.tour] || []).push(m);
  // Vue liste : d'abord les tours gagnants (WB tour 1, 2...), puis les perdants (LB 1, 2...), puis le tableau final
  const ordered = [
    ...rounds.filter(r => r.bracket === 'WB'),
    ...rounds.filter(r => r.bracket === 'LB'),
    ...rounds.filter(r => r.bracket === 'F'),
  ];
  for (const r of ordered) {
    const matchs = (byKey[r.bracket + r.tour] || []).sort((a, b) => a.position - b.position).filter(matchJoueur);
    if (!matchs.length) continue;
    const section = el('div', { class: 'round', id: 'col-' + r.bracket + r.tour },
      el('h3', {}, `${r.label} · race to ${r.manches}`),
      el('div', { class: 'liste-matchs' }));
    for (const m of matchs) {
      const feeders = t.matchs.filter(x => x.suivant_id === m.id || x.perdant_id === m.id)
        .map(x => feederLabel(t, x, x.perdant_id === m.id ? 'perdant' : 'vainqueur'));
      section.lastChild.append(matchCard(m, {
        // pas de onClick: matchCard ouvre l'éditeur inline si PIN admin en mémoire, sinon va sur /match.html
        extra: m.etat === 'prevu' && feeders.length
          ? el('div', { class: 'attente-detail' }, `⏳ attendu : ${feeders.join('  vs  ')}`)
          : null,
      }));
    }
    container.append(section);
  }
}

window.addEventListener('resize', () => { const t = state && state.actif; if (t) requestAnimationFrame(() => drawBracketLinks(t)); });

async function init() {
  state = await api('/api/etat');
  render();
  connecterSSE((s) => { state = s; render(); });
}
init();
</script>
</body>
</html>
